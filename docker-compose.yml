services:

  db:
    image: postgres:15-alpine
    container_name: mnair_postgres
    environment:
      POSTGRES_DB: mnair_db
      POSTGRES_USER: mnair
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnair"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mnair_network

  redis:
    image: redis:7-alpine
    container_name: mnair_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - mnair_network

  minio:
    image: minio/minio:latest
    container_name: mnair_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - mnair_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mnair_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mnair:${DATABASE_PASSWORD}@db:5432/mnair_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      APP_ENV: production
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mnair_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mnair_celery_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mnair:${DATABASE_PASSWORD}@db:5432/mnair_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mnair_network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mnair_celery_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mnair:${DATABASE_PASSWORD}@db:5432/mnair_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      APP_ENV: production
    depends_on:
      - redis
      - db
    restart: unless-stopped
    networks:
      - mnair_network

  nginx:
    image: nginx:alpine
    container_name: mnair_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/mnair.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/mnair:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mnair_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  mnair_network:
    driver: bridge
