services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: mnair_postgres
    environment:
      POSTGRES_DB: mnair_db
      POSTGRES_USER: mnair
      POSTGRES_PASSWORD: mnair_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnair"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mnair_network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: mnair_redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mnair_network

  # MinIO Object Storage (for certificates, images)
  minio:
    image: minio/minio:latest
    container_name: mnair_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - mnair_network

