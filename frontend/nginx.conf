# One-time clean-up after the October 2026 compromise: the first page a
# browser loads from us carries Clear-Site-Data "cache" (wipes anything it
# cached from the attacker for this site) and a cookie so it's done once,
# not on every visit. Bump the cookie name to run the clean-up again.
map $cookie_mnair_clean_1 $mnair_clear_site_data {
    "1"     "";
    default '"cache"';
}
map $cookie_mnair_clean_1 $mnair_clean_cookie {
    "1"     "";
    default "mnair_clean_1=1; Path=/; Max-Age=31536000; Secure; SameSite=Lax";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Built JS/CSS have a content hash in the name: cache forever
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The real service worker: always re-checked, never served stale
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Any other script URL is one we never published -- e.g. a rogue
    # service worker planted during the compromise (/service-worker.js,
    # /sw2.js, ...). Answer with the kill switch as real JavaScript so the
    # browser accepts it as the "update" and the rogue worker removes itself.
    # (Without this the SPA fallback below returned index.html as text/html,
    # which the browser rejects, leaving the rogue worker installed.)
    location ~* \.(js|mjs)$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /sw-reset.js =404;
    }

    location = /sw-reset.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ^~ /images/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Pages: always revalidate so a fix reaches phones on the next visit
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Clear-Site-Data $mnair_clear_site_data;
        add_header Set-Cookie $mnair_clean_cookie;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
