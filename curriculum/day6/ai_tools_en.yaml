day: 6
topic: ai_tools
language: en
title: "Your Business AI Toolkit: Start Earning with AI"
content: |
  You've learned tools for creating. Today: tools specifically for running and growing a business.

  CUSTOMER SERVICE (respond 24/7 without staying awake):
  - WhatsApp Business: auto-reply for FAQs, product catalog, quick-reply buttons — FREE
  - Tidio: live chat + AI chatbot for your website, has a free plan
  - ManyChat: WhatsApp and Instagram DM automation — very popular with Nigerian sellers

  MARKETING (write, design, post — in minutes):
  - ChatGPT: product descriptions, sales copy, email campaigns, SMS content
  - Canva Magic Studio: social media posts, flyers, banners — all matching your brand
  - Buffer AI: suggests the best time to post your content per platform

  FINANCIAL MANAGEMENT (know your numbers):
  - Wave (free accounting): invoices, expense tracking, AI-powered categorization
  - Google Sheets + formula AI: ask Gemini to analyze your sales spreadsheet
  - Receipt scanning: use your phone camera to digitize paper receipts

  SALES INTELLIGENCE (find and keep customers):
  - LinkedIn Sales Navigator AI: find B2B customers if you sell to companies
  - Apollo.io free tier: prospect list building for service businesses
  - Simple CRM: even a Google Sheet with customer names, last purchase, and next follow-up date beats nothing

  BUILD YOUR OWN AI TOOL (zero code):
  - Google Forms + ChatGPT: customer fills a form → you paste responses → AI gives you a quote or recommendation
  - WhatsApp + Zapier + Sheets: every WhatsApp inquiry logged automatically

  THE ₦0 BUSINESS TOOLKIT:
  WhatsApp Business + Canva + ChatGPT free tier + Google Sheets = a complete business operation. Many successful Nigerian businesses run on exactly this stack.

