  - question: "Kini Wave iṣiro ọfẹ n ṣe pẹlu AI?"
    options:
      - "A. O n pin inawo laifọwọyi"
      - "B. O n sọtẹlẹ awon iye ọja ọja ṣẹẹbu"
      - "C. O n sanwo awon alatuta taara"
      - "D. O n mu tikẹti ọkọ ofurufu"
    correct: 0

  - question: "Kini apapọ apoti irinse iṣowo ₦0?"
    options:
      - "A. WhatsApp Business plus Canva plus ChatGPT ọfẹ plus Google Sheets"
      - "B. Sọfitiwia SAP gbowolori nikan"
      - "C. Awon akanti banki ajeji"
      - "D. Ọfiisi ti ara ni Lagos"
    correct: 0

  - question: "Kini Buffer AI n daba?"
    options:
      - "A. Akoko ti o dara julọ lati firanṣẹ ohun elo lori ikpo kọọkan"
      - "B. Iru ọja wo ni lati ta"
      - "C. Awon onibara wo ni lati yago fun"
      - "D. Banki ti o lailewu julọ fun lilo"
    correct: 0

  - question: "Bawo ni o ṣe le kọ irinse iye onibara laisi koodu?"
    options:
      - "A. Google Forms fun titẹ sii plus ChatGPT lati ṣe iye"
      - "B. O gbọdọ gba olupilẹṣẹ"
      - "C. Ṣee ṣe nikan pẹlu oye kimputa sayensi"
      - "D. Ko ṣee ṣe sibẹsibẹ"
    correct: 0
