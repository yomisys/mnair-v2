    options:
      - "A. Oniwun iṣowo ti o fi ṣiṣẹ"
      - "B. Ile-iṣẹ AI nikan"
      - "C. Ẹnikẹni"
      - "D. Olupese nẹtiwọki foonu onibara"
    correct: 0

  - question: "Kini iyatọ idi owo nipasẹ AI?"
    options:
      - "A. Ṣiṣe iṣiro idiyele oriṣiriṣi fun awon onibara oriṣiriṣi fun ohun kanna da lori owo ti a ṣe ipinnu"
      - "B. Fifun awon onibara olododo ni ẹdinwo"
      - "C. Ṣiṣe iṣiro diẹ sii fun awon ọja igbadun"
      - "D. Ṣiṣe awon tita igba"
