  - question: "Kini Iṣiro Igbẹkẹle ninu iṣowo AI?"
    options:
      - "A. Awon iṣowo olotitọ n kọ igbẹkẹle iṣọkan; ẹtan kan yoo tuka gbogbo rẹ"
      - "B. Iyara ifijiṣẹ n ṣe pataki julọ"
      - "C. Idiyele ni ifosiwewe nikan"
      - "D. Igbẹkẹle ko le kọ lori ayelujara"
