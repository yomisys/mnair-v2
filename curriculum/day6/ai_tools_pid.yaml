day: 6
topic: ai_tools
language: pid
title: "Your Business AI Toolkit: Start Earn Money with AI"
content: |
  You don learn tools for creating. Today: tools specifically for running and growing business.

  CUSTOMER SERVICE (reply 24/7 without staying awake):
  - WhatsApp Business: auto-reply for common questions, product catalog, quick-reply buttons — FREE
  - Tidio: live chat plus AI chatbot for your website, e get free plan
  - ManyChat: WhatsApp and Instagram DM automation — very popular among Naija sellers

  MARKETING (write, design, post — for minutes):
  - ChatGPT: product descriptions, sales copy, email campaigns, SMS content
  - Canva Magic Studio: social media posts, flyers, banners — all matching your brand
  - Buffer AI: e go suggest the best time to post your content per platform

  FINANCIAL MANAGEMENT (know your numbers):
  - Wave (free accounting): invoices, expense tracking, AI-powered categorization
  - Google Sheets plus formula AI: ask Gemini analyze your sales spreadsheet
  - Receipt scanning: use your phone camera digitize paper receipts

  SALES INTELLIGENCE (find and keep customers):
  - LinkedIn Sales Navigator AI: find B2B customers if you dey sell to companies
  - Apollo.io free tier: prospect list building for service businesses
  - Simple CRM: even Google Sheet with customer names, last purchase, and next follow-up date better pass nothing

  BUILD YOUR OWN AI TOOL (zero code):
  - Google Forms plus ChatGPT: customer fill form → you paste responses → AI give you quote or recommendation
  - WhatsApp plus Zapier plus Sheets: every WhatsApp inquiry go log automatically

  THE ₦0 BUSINESS TOOLKIT:
  WhatsApp Business plus Canva plus ChatGPT free tier plus Google Sheets = complete business operation. Many successful Naija businesses dey run on exactly this stack.

