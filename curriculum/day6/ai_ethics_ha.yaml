    correct: 0

  - question: "Menene nuna bambanci a farashi ta AI?"
    options:
      - "A. Caji abokan ciniki daban-daban farashin daban-daban don abu ɗaya bisa kuɗi da aka ƙiyasta"
      - "B. Bai wa abokan ciniki masu aminci rangwame"
      - "C. Caji karin don kayan alatu"
      - "D. Gudanar da tallace-tallace na lokaci"
    correct: 0

  - question: "Menene Lissafin Amana a kasuwancin AI?"
    options:
