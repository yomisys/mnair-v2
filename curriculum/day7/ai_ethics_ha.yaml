  - question: "Menene ƙa'idar 'taimaka wa mutumin ɗaya'?"
    options:
      - "A. Koyar da mutumin ɗaya yana ƙirƙirar ripple da ke girma ilimi"
      - "B. Dole ka zama malami na yau da kullum da farko"
      - "C. Koyar da mutanen da suka riga sun san AI kawai"
      - "D. Jira har ka zama ƙwararre kafin ka koya"
    correct: 0

  - question: "Wane 'yancin kana da shi lokacin da AI ya yanke shawara game da kai?"
    options:
      - "A. Tambaya yadda yake aiki, ko za ka iya yin ƙara, da wa ke da alhakin"
      - "B. Babu 'yancin — shawarwarin AI na ƙarshe ne"
      - "C. Masu arziki kawai za su iya tambaya AI"
      - "D. Dole ka karɓi duk shawarwarin AI"
    correct: 0

  - question: "Me Alkawarin AI ke alƙawarta?"
    options:
      - "A. Ƙirƙira ba yaudara, raba ba ɓoye, tambaya sakamakon, gina don al'umma"
      - "B. Amfani da kayan aikin AI mafi tsada kawai"
      - "C. Kada ka taɓa tambaya AI"
      - "D. Ɓoye ilimin AI sir"
    correct: 0
