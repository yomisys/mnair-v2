day: 7
topic: ai_ethics
language: ha
title: "Kasance Canjin: Jagorancin AI mai Ɗabi'a a Najeriya"
content: |
  Ka kammala koyon AI na kwanaki 7. Tare da wannan ilimi ya zo alhakin da ya wuce kasuwancinka ko aikin kanka.

  BAYAR DA SHAWARA DON MANUFOFIN AI MASU KYAU:
  Manufofin AI na Najeriya har yanzu ana tsarawa. Dokokin AI a cikin daukar aiki, bashi, kiwon lafiya, da ilimi za su shafi Najeriyawa miliyan da yawa — mafi yawansu ba su san AI yana wanzu ba tukuna. Mutanen da suka fahimci AI (kamar kai yanzu) suna bukatar kasancewa wani ɓangare na waɗannan tattaunawa. Tuntuɓi wakilanku na gwamnatin gida. Ka amsa shawarwari na manufofi. Muryarku tana da muhimmanci.

  BAYYANA AI CUTARWA LOKACIN DA KA GANI:
  Labarai na ƙarya da AI ke samarwa yana yaɗuwa akan WhatsApp. Bidiyon deepfake na 'yan siyasa suna faɗin abubuwan da ba su faɗa ba. Algorithms na bashi masu nuna son kai na ƙin cancantattu. Gane fuska da AI wanda ba ya aiki ga launin fata mai duhu. Lokacin da ka ga cutarwa, ba da rahoton ta — zuwa dandali, zuwa FCCPC, ko a bainar jama'a.

  TAIMAKA WA MUTUMIN ɗAYA:
  Abu ɗaya mafi tasirin da za ka yi bayan wannan kwas shi ne koyar da wani mutumin abin da ka koyi. Ba babban horon yau da kullum ba — kawai tattaunawa: "Hey, na yi koyon AI kuma ina son nuna maka wani abu mai amfani." Wannan mutumin ya koya wa wani. Haka ilimi ke girma.

  BUKATAR LISSAFI:
  Lokacin da kamfani ko gwamnati ta yi amfani da AI don yanke shawara game da kai — maki bashi, neman aiki, gano cuta — kana da 'yancin tambaya: Ta yaya wannan ke aiki? Zan iya yin ƙara? Wa ke da alhakin idan ya yi kuskure? Waɗannan tambayoyi ne masu ma'ana. Ka tambayi su.

  ALKAWARIN AI NAKA:
  Zan yi amfani da AI don ƙirƙira, ba yaudara ba.
  Zan raba abin da na koyi, ba ɓoye shi ba.
  Zan tambaya sakamakon AI, ba karɓarsu makantu ba.
  Zan gina don al'ummata, ba kaina kawai ba.
  Zan kasance irin mai amfani da AI da Najeriya take bukata.

  TAYA MURNA. KA KAMMALA.

quiz:
