title: "Keep Learning: Your AI Roadmap After This Course"
content: |
  Today na the end of Week 1. E also na the start of everything else. Here na exactly where to go next.

  FREE LEARNING PATHWAYS:

  BEGINNER (start here if you want go deeper):
  - Google "AI Essentials" course (free, certificate included) — cover AI fundamentals and Google Workspace AI tools
  - Microsoft "AI Skills Challenge" — free, short, practical
  - Khan Academy AI course — free, visual, beginner-friendly

  INTERMEDIATE (when you ready to build):
  - DeepLearning.AI short courses (Andrew Ng) — plenty dey free, 1-2 hours each
  - fast.ai — free, practical machine learning, dey run on free Google Colab
  - Kaggle Learn — free micro-courses on data, AI, and Python

  AFRICAN AI COMMUNITIES (connect and grow):
  - AI Saturdays Lagos (AISatLagos) — free weekly AI learning sessions for Lagos
  - Zindi.africa — African AI competitions with cash prizes, beginner to advanced
  - Deep Learning Indaba — annual African AI conference, scholarship programs
  - AI/ML Africa WhatsApp groups — active learning communities

  GET PAID FOR AI SKILLS (starting points):
  - Upwork/Fiverr: offer AI-assisted services (content writing, design, research)
  - Local businesses: offer to set up their WhatsApp Business AI auto-reply
  - Teaching: run local WhatsApp AI literacy group — charge ₦500 per person
  - Freelance prompt engineering: companies dey pay people wey dey get results from AI

  YOUR 30-DAY CHALLENGE:
  Week 1: Use one new AI tool every day
  Week 2: Create something real and share am
  Week 3: Teach somebody else wetin you know
  Week 4: Identify one problem for your community wey AI fit help solve, propose solution

  THE BEST AI EDUCATION NA DOING.

