day: 7
topic: what_is_ai
language: ha
title: "Menene AI Zai Kasance a 2030 — Da Rôlinka a Ciki"
content: |
  Rana ta 7 — Ranar ƙarshe. Bari mu duba gaba. AI da ka koyi wannan mako yana da ƙarfi ƙwarai, amma kuma yana cikin sigar farko-farko na abin da ke zuwa.

  ABIN DA KE CANZAWA A CIKIN SHEKARU 5 MASU ZUWA:

  DAGA KAYAN AIKI ZUWA WAKILAN AI:
  AI na yau yana amsa tambayoyinka. AI na gobe yana ɗaukar ayyuka: yana kama alkawura, yana oda kayayyaki, yana amsa e-mail, yana tattaunawa a madadinka — duk yayin da kake barci. Ka yi tunanin cewa yana tafiya daga mataimaki mai wayo da kake tattaunawa da shi, zuwa wanda zai iya aiki a madadinka.

  AI NA YARE DA YAWA YA INGANTA:
  Yana iya yin aiki da harsuna da yawa. Zuwa 2030, AI zai fahimci Hausa, Yoruba, Igbo, da Pidgin kamar yadda yake fahimci Turanci yanzu. Ka nuna kwamfuta wayarka zuwa injin da ya karye, ka yi magana cikin Hausa, AI kuma zai amsa cikin Hausa da umarnin gyarawa.

  WANE AYYUKA ZA SU CANZA:
  Ayyukan da za su ɓace: shigar bayanai, fassarar takardun yau da kullum, rubutun hidimar abokin ciniki mai sauƙi. Ayyukan da za su girma: masu horar da AI, injiniyoyin bayar da umarnin AI, masu binciken AI, jami'an ɗabi'ar AI, ƙwararrun haɗawa da AI. Ƙwarewa da ake bukata a fili ita ce sanin YADDA ake aiki tare da AI — daidai abin da ka yi wannan mako.

  RÔLINKA:
  Najeriya tana da mutane miliyan 220, al'ummar matasa, da matsaloli na gaske da AI zai iya taimakawa wajen warware su. Mutanen da za su tsara yadda AI ke aiki a Najeriya za su kasance Najeriyawa da suka fahimta — kamar kai yanzu.

  GABA BA WANI ABU NE DA ZAI FARU MAKA BA. KAI NE KE GINASHI.

