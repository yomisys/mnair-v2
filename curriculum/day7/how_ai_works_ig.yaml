  - question: "Nka mmadụ ole na ole na-abụrịrị ndị bara ỤBA karị mgbe AI na-arịgo ọsọ?"
    options:
      - "A. Ikpe, ikike mmepụta, na ọmụmụ mpaghara"
      - "B. Ikike iti ntinye ngwa ngwa karị"
      - "C. Ịchekwa nkọwa ọrụ teknụzụ"
      - "D. Ntinye data dị mfe"
    correct: 0

  - question: "Kedu ike AI ọtụtụ asụsụ a kwadoro ruo 2028?"
    options:
      - "A. AI na-ejikwa ederede, olu, onyonyo, na vidiyo nke ọma n'asụsụ obodo"
      - "B. AI na-arụ ọrụ naanị n'Bekee"
      - "C. AI chọọ ugegbe pụrụ iche iji ya"
      - "D. AI na-arụ ọrụ naanị na komputa ndị ike"
    correct: 0
