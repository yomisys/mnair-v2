  - question: "Which camera feature uses machine learning?"
    options:
      - "A. Portrait mode with blurred background"
      - "B. The physical lens"
      - "C. The volume button"
      - "D. The charging port"
    correct: 0

  - question: "How does Google Maps know traffic will be heavy at 5pm?"
    options:
      - "A. It guesses based on the weather"
      - "B. ML learned from millions of past trips"
      - "C. Police report it manually"
      - "D. It cannot predict traffic"
    correct: 1
