id: day2_ai_tools_en
day: 2
topic: ai_tools
language: en
title: "ML-Powered Tools You Already Use"
content: |
  Surprise: you've been using machine learning for years without knowing! Today, let's spot the ML hiding in your everyday apps - and learn to use it better.

  YOUR KEYBOARD:
  When you type "how far" and your phone suggests "now?", that's an ML model trained on billions of sentences. Tip: your keyboard learns YOUR style over time - it will even learn your pidgin!

  WHATSAPP & SOCIAL MEDIA:
  - Status and feed ordering: ML predicts which posts you'll engage with
  - Voice note transcription on some phones: ML converts speech to text
  - Photo enhancement: ML brightens dark photos automatically

  YOUTUBE & MUSIC APPS:
  The recommendation engine is pure ML. It learned from millions of viewers: "People who watched A also enjoyed B." Tip: your recommendations improve when you click "Not interested" on videos you dislike - you're giving the model better training signals!

  CAMERA APPS:
  Portrait mode (blurred background), night mode, and face beautification are all ML models. Your ₦80,000 phone does tricks that needed professional equipment 10 years ago.

  MAPS:
  Google Maps predicts that Third Mainland Bridge will be heavy at 5pm because ML learned from millions of past trips.

  THE LESSON: ML is not future technology - it's already in your pocket. Now that you can SEE it, you can use it smarter:
  1. Give apps honest feedback (like/dislike) to improve recommendations
  2. Use voice typing in English - it's surprisingly good now
  3. Try Google Photos search: type "food" and it finds your food photos using ML!

quiz:
  - question: "What powers your keyboard's next-word suggestions?"
    options:
      - "A. A dictionary made by hand"
      - "B. An ML model trained on billions of sentences"
      - "C. Random guessing"
      - "D. Your network provider"
    correct: 1

  - question: "How does YouTube decide what to recommend to you?"
    options:
      - "A. ML learned patterns from millions of viewers"
      - "B. Staff pick videos for each user"
      - "C. It shows videos alphabetically"
      - "D. The government chooses"
    correct: 0

  - question: "How can you improve your app recommendations?"
    options:
      - "A. Buy a new phone every year"
      - "B. Give honest feedback like clicking 'Not interested'"
      - "C. Watch everything to confuse it"
      - "D. You cannot influence them"
