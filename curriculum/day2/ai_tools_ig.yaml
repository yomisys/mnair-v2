day: 2
topic: ai_tools
language: ig
title: "Ngwa ML I Na-Ejilarị Eme Ihe"
content: |
  Ihe ijuanya: i na-eji machine learning eme ihe otutu afo n'amaghi ama! Taa, ka anyi chota ML zoro ezo n'ime app gi kwa ubochi - ma muta iji ha eme ihe nke oma.

  KEYBOARD GI:
  Mgbe i dere "kedu" ekwenti gi atuo aro "ka i mere", nke ahu bu ML model e ji otutu ijeri ahiriokwu zuo. Ndumodu: keyboard gi na-amuta uzo NKE GI ka oge na-aga - o ga-amutadi asusu Igbo gi!

  WHATSAPP & SOCIAL MEDIA:
  - Nhazi status na feed: ML na-ebu amuma posts ndi ga-amasi gi
  - Idegharia ozi olu na ufodu ekwenti: ML na-agbanwe okwu ka o buru ihe edere
  - Imeziwanye foto: ML na-eme ka foto gbara ochichiri na-enwu n'onwe ya

  YOUTUBE & APP EGWU:
  Injin ntu aro bu ML kpamkpam. O mutara site n'otutu nde ndi na-ekiri: "Ndi kiriri A masikwara B." Ndumodu: ntu aro gi ga-aka mma ma i pia "Not interested" na vidiyo ndi na-adighi amasi gi - i na-enye model ahu akara ozuzu ka mma!

  APP IGWEFOTO:
  Portrait mode (azu gbaru agbaru), night mode, na ime ka ihu maa mma - ha niile bu ML models. Ekwenti naira 80,000 gi na-eme ihe ndi choro ngwa oru ndi oka mmuta afo 10 gara aga.

  MAP:
  Google Maps na-ebu amuma na Third Mainland Bridge ga-eju na elekere ise nke mgbede n'ihi na ML mutara site n'otutu nde njem gara aga.

  IHE OMUMU: ML abughi teknuzu odiniru - o dilarị n'akpa gi. Ugbu a i nwere ike IHU ya, i nwere ike iji ya eme ihe n'uzo amamihe:
  1. Nye app nzaghachi eziokwu (masi/amasighi) iji meziwanye ntu aro
  2. Jiri idekwu olu na Bekee - o di mma nke ukwuu ugbu a
  3. Nwalee ochucho Google Photos: dee "food" o ga-achota foto nri gi site na ML!

