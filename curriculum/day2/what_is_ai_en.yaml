day: 2
topic: what_is_ai
language: en
title: "AI vs Machine Learning: What's the Difference?"
content: |
  Yesterday you learned what AI is. Today, let's understand the engine inside AI: Machine Learning (ML).

  ORDINARY PROGRAMS follow fixed rules. A calculator always gives 2 + 2 = 4 because a programmer wrote that rule. If something new happens, the program cannot adapt.

  MACHINE LEARNING is different. Instead of writing rules, we show the computer examples and it discovers the rules by itself. Nobody can write rules for recognizing every face in Nigeria - but ML can learn faces from photos.

  Think of it like this:
  - Ordinary program: A recipe card - follow steps exactly, same result every time
  - Machine learning: A market trader's instinct - after years of customers, she knows who will price seriously and who is just looking

  AI is the big goal (machines that act intelligently). Machine Learning is the main method we use today to reach that goal. Almost every AI you used yesterday - fraud detection, face unlock, word prediction - is machine learning.

  There is also DEEP LEARNING - a powerful type of ML inspired by the human brain. It powers ChatGPT, voice assistants, and photo recognition. Deep learning needs lots of data and computing power.

  Simple summary: AI is the dream, Machine Learning is the engine, Deep Learning is the turbo version of that engine. You don't need mathematics to understand this - you just need to remember: ML learns from examples, not fixed rules.

quiz:
  - question: "How is machine learning different from an ordinary program?"
    options:
      - "A. It learns rules from examples instead of following fixed rules"
