day: 2
topic: ai_in_nigeria
language: pid
title: "Machine Learning Dey Solve Naija Problems"
content: |
  Now wey you know say machine learning dey learn from examples, make we see how Naija companies dey use am every day.

  LOAN WITHOUT COLLATERAL:
  Traditional banks dey demand land documents or salary account. But fintech apps like Carbon and FairMoney dey use ML wey dem train with thousands of past borrowers. The model learn patterns: airtime habits, repayment history, even how you take fill the form. Result? Market woman for Onitsha fit collect loan for 5 minutes without entering any bank.

  FRAUD DETECTION:
  ML models for Naija banks dey watch millions of transactions. Dem don learn wetin NORMAL be for you. If your card suddenly buy electronics for 3am for another country, the model go flag am immediately. Fixed rules no fit do this one - fraudsters dey change tactics, but ML dey keep learning new patterns.

  CROP DISEASE DETECTION:
  Researchers train ML models with thousands of photos of healthy and sick cassava leaves. Now apps fit tell farmer for Ogun State if e cassava get mosaic disease - just from phone photo. The model learn from examples, exactly like how you take learn mango!

  PERSONALIZED LEARNING:
  uLesson ML dey watch which questions student dey fail and e dey adjust the next lessons. Two students no dey ever see exactly the same path - each person dey get wetin e need.

  THE PATTERN: For every case, Naija people gather LOCAL examples and train models with them. Foreign AI wey dem train with foreign data dey often fail for here. Naija AI future depend on Naija data - and people like you wey understand am.

quiz:
