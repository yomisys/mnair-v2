day: 2
topic: what_is_ai
language: pid
title: "AI vs Machine Learning: Wetin Be the Difference?"
content: |
  Yesterday you learn wetin be AI. Today, make we understand the engine wey dey inside AI: Machine Learning (ML).

  ORDINARY PROGRAMS dey follow fixed rules. Calculator go always give 2 + 2 = 4 because na programmer write that rule. If new thing happen, the program no fit adjust.

  MACHINE LEARNING different. Instead make we write rules, we go show the computer examples and e go discover the rules by imself. Nobody fit write rules to recognize every face for Naija - but ML fit learn faces from photos.

  Think am like this:
  - Ordinary program: Recipe card - follow the steps exactly, same result every time
  - Machine learning: Market trader sense - after years of customers, she sabi who go price seriously and who just dey look

  AI na the big goal (machines wey dey act with sense). Machine Learning na the main method wey we dey use today to reach that goal. Almost every AI wey you use yesterday - fraud detection, face unlock, word prediction - na machine learning.

  E still get DEEP LEARNING - one powerful type of ML wey dem copy from human brain. Na im dey power ChatGPT, voice assistants, and photo recognition. Deep learning need plenty data and computing power.

  Simple summary: AI na the dream, Machine Learning na the engine, Deep Learning na the turbo version of that engine. You no need mathematics to understand this one - just remember: ML dey learn from examples, no be from fixed rules.

quiz:
  - question: "How machine learning take different from ordinary program?"
    options:
      - "A. E dey learn rules from examples instead of fixed rules"
      - "B. E dey always slow pass"
      - "C. E dey only work for big computers"
      - "D. No difference at all"
