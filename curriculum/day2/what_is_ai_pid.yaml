  - question: "Which one be example of fixed-rule program (NO be machine learning)?"
    options:
      - "A. Face unlock for your phone"
      - "B. Calculator wey dey add numbers"
      - "C. Fraud detection for banking apps"
      - "D. Word prediction when you dey type"
