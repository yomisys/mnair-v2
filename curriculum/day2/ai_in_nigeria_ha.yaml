      - "A. Ba sa duba komai"
      - "B. Modelolin ML na koyon alamu daga dubban masu karbar lamuni na baya"
      - "C. Suna kiran dattijon kauyenka"
      - "D. Ma'aikatan gwamnati kawai suke ba lamuni"
