  - question: "Me ya sa ML ya fi tsayayyun dokoki wajen gano zamba?"
    options:
      - "A. ML ya fi rahusa wajen rubutawa"
      - "B. Masu zamba na canza dabaru, ML kuma na ci gaba da koyon sabbin alamu"
      - "C. Tsayayyun dokoki haramun ne"
      - "D. ML ba ya taba kuskure"
    correct: 1

  - question: "Ta yaya aka horar da modelolin gano cututtukan amfanin gona?"
    options:
      - "A. Da dubban hotunan ganye masu lafiya da marasa lafiya"
      - "B. Ta karanta littattafan noma"
      - "C. Ta tattaunawa da manoma"
      - "D. Ba a horar da su ba ko kadan"
    correct: 0

  - question: "Me ya sa AI na kasashen waje kan kasa a Najeriya?"
    options:
      - "A. Hanyoyin sadarwar Najeriya na toshe shi"
      - "B. An horar da shi da bayanan waje, ba misalan Najeriya ba"
      - "C. Ya yi rahusa sosai"
      - "D. AI na waje ba ya taba kasawa"
    correct: 1

  - question: "Me ML na uLesson ke kebancewa ga kowane dalibi?"
    options:
      - "A. Kayan makaranta"
      - "B. Darussan da ake nunawa, bisa tambayoyin da ya kasa"
      - "C. Ranakun jarrabawa"
      - "D. Kudin makaranta"
    correct: 1
