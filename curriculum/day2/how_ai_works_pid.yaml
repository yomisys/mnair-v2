day: 2
topic: how_ai_works
language: pid
title: "Training and Prediction: The Two Lives of AI"
content: |
  Every machine learning system get two lives: TRAINING (school time) and PREDICTION (work time). If you understand this one, you don understand all of AI.

  LIFE 1 - TRAINING (Learning):
  Imagine say you dey teach young apprentice tailor. You show her 500 finished clothes: "This na agbada, this na kaftan, this na senator wear." She go study them, make mistakes, collect correction, and slowly slowly she go improve. Na that one be training!

  During training, the AI go:
  1. Receive plenty labeled examples (photo + "this na mango")
  2. Make e own guess
  3. Check if the guess correct
  4. Adjust imself small when e wrong
  5. Repeat am millions of times until e accurate

  LIFE 2 - PREDICTION (Working):
  After training, the apprentice go open her own shop. Now customers go bring new fabrics wey she never see before, and she go still sew am correct. Na so trained AI dey work - e dey handle NEW situations with wetin e don learn.

  When your bank app check transaction for 1 second, na prediction be that. The months of learning from millions of past transactions don already happen for training.

  IMPORTANT POINTS:
  - Training dey slow and e dey cost; prediction dey fast and cheap
  - AI only know wetin e see for training - if e never see Naija food photos, e fit call moi moi "muffin"!
  - Na why local data matter for Naija AI

  Tomorrow we go learn about the fuel for all this thing: DATA.

