day: 2
topic: how_ai_works
language: yo
title: "Ikeko ati Asotele: Aye Meji ti AI"
content: |
  Gbogbo eto machine learning ni aye meji: IKEKO (akoko ile-iwe) ati ASOTELE (akoko ise). Loye eyi yoo ran o lowo lati loye gbogbo AI.

  AYE 1 - IKEKO (Kiko Eko):
  Foju inu wo kiko omo-ise telo. O fi aso 500 ti a ti pari han an: "Eyi ni agbada, eyi ni kaftan, eyi ni senator." O n ko won, o n se asise, a n se atunse fun un, die die o si n dara si. Iyen ni ikeko!

  Lasiko ikeko, AI yoo:
  1. Gba opolopo apeere ti a ti fi aami si (foto + "mangoro ni eyi")
  2. Se akiyesi tire
  3. Se ayewo boya akiyesi naa to
  4. Se atunse ara re die ti o ba se asise
  5. Tun se ni miliọnu igba titi yoo fi pe

  AYE 2 - ASOTELE (Sise):
  Leyin ikeko, omo-ise naa yoo si ile-itaja tire. Bayii awon onibara n mu aso titun wa ti ko ti ri ri, sibe o le ran won daradara. Bee ni AI ti a ti ko se n sise - o n koju ipo TITUN pelu ohun ti o ti ko.

  Nigbati app banki re ba se ayewo isowo ni iseju kan, asotele ni yen. Awon osu kiko eko lati miliọnu isowo ti o koja ti sele teletele ni ikeko.

  AWON KOKO PATAKI:
  - Ikeko n gba akoko o si n na owo; asotele yara o si din owo
  - AI mo ohun ti o ri ni ikeko nikan - ti ko ba ti ri foto ounje Naijiria ri, o le pe moi moi ni "muffin"!
  - Idi niyen ti data ibile fi se pataki fun AI Naijiria

  Lola a o ko nipa epo fun gbogbo eyi: DATA.

quiz:
  - question: "Ki ni 'aye meji' ti eto machine learning?"
    options:
      - "A. Osan ati oru"
      - "B. Ikeko ati asotele"
      - "C. Gbigba agbara ati lilo agbara"
      - "D. Online ati offline"
