  - question: "Ki ni o n sele lasiko ikeko?"
    options:
      - "A. AI n ko awon apeere ti a fi aami si, o si n se atunse ara re ti o ba se asise"
      - "B. AI n simi, o n fi agbara pamo"
      - "C. AI n pa data re re"
      - "D. AI n te iroyin jade"
    correct: 0

  - question: "Kilode ti AI le pe moi moi ni 'muffin'?"
    options:
      - "A. Nitori ko ri ounje Naijiria ri lasiko ikeko"
      - "B. Nitori muffin ni moi moi"
      - "C. Nitori AI korira ounje Naijiria"
      - "D. Nitori foonu naa ti gbo"
    correct: 0

  - question: "Gbolohun wo lo je OTITỌ?"
    options:
      - "A. Ikeko yara, asotele lora"
      - "B. Ikeko n gba akoko o si n na owo, asotele yara"
      - "C. Awon mejeji n sele papo nigbagbogbo"
      - "D. Asotele n waju ikeko"
    correct: 1

  - question: "Nigbati app banki re ba se ayewo isowo ni iseju kan, ki ni o n sele?"
    options:
      - "A. Ikeko"
      - "B. Asotele pelu ohun ti o ti ko teletele"
      - "C. App naa kan n se akiyesi lasan"
      - "D. Eniyan lo n se ayewo re"
    correct: 1
