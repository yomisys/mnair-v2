language: ha
title: "Ta Yaya AI Ke Aiki?"
content: |
  AI yana aiki ta hanyar koyo daga bayanai - misalai masu yawan gaske. Ka yi tunanin koya wa yaro abin da mangwaro yake. Za ka nuna masa mangwaro da yawa har sai ya iya gane kowane mangwaro, har ma wadanda bai taba gani ba. Haka AI ke koyo!

  Matakai Uku na AI:

  1. TATTARA BAYANAI: Tara misalai masu yawa
     - Don gane fuska: dubban hotunan fuska
     - Don fassarar harshe: miliyoyin jimloli
     - Don gano zamba: bayanan ma'amaloli na baya

  2. HORO (TRAINING): AI yana nazarin alamu
     - Kamar yadda ka koyi cewa kore da rawaya galibi na nufin "danfo na Lagos"
     - AI yana samun alamun da mutane za su iya rasawa
     - Wannan shi ake kira "machine learning"

  3. HASASHE (PREDICTION): AI yana amfani da abin da ya koya
     - Wayarka tana hasashen kalma ta gaba lokacin rubutu
     - YouTube yana ba da shawarar bidiyon da kake iya so
     - Bankuna na hasashen ko ma'amala na da shakku

  Ka dauki AI kamar agbero a tashar mota - bayan ya ga dubban fasinjoji, zai iya gane wanda ke tafiya nesa cikin sauri ta kayansa kawai!

  Yawan ingantattun bayanai da AI ke gani, shi ke kara masa kyau. Munanan bayanai na haifar da mummunan AI - shi ya sa inganci ke da muhimmanci.

