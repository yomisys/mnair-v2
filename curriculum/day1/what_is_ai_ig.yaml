id: day1_what_is_ai_ig
day: 1
topic: what_is_ai
language: ig
title: "Gini Bu Artificial Intelligence (AI)?"
content: |
  Artificial Intelligence (AI) bu mgbe komputa na igwe nwere ike ime ihe ndi na-achokari ogugu isi mmadu. Chee ya di ka ikuziri komputa ka o muta ihe, chee echiche, ma mee mkpebi.

  Na Naijiria, AI agbaala gi gburugburu! Mgbe app ulo aku gi choputara aghugho, mgbe Google sugharia Igbo gaa Bekee, ma o bu mgbe ekwenti gi matara ihu gi - o bu AI na-aru oru.

  Ihe AI nwere ike ime:
  - Imata usoro (di ka ichoputa ego naira adigboroja)
  - Ibu amuma (di ka amuma ihu igwe maka ndi oru ugbo)
  - Ighota asusu (di ka chatbot na-aza ajuju)
  - Ihu na imata ihe (di ka igwefoto na-agu nomba ugboala)

  AI abughi anwansi ma o bu robot yiri mmadu. O bu mmemme komputa na-amuta site na data iji dozie nsogbu. Di ka i si muta inya okada site n'omume, otu ahu ka AI si amuta site n'ihu otutu ihe atu.

  Naijiria choro nka AI! Site n'oru ugbo ruo ahuike, ulo aku ruo agumakwukwo - AI nwere ike inyere anyi aka idozi nsogbu anyi. O bu ya mere i ji amu ihe a!

quiz:
  - question: "Gini bu Artificial Intelligence?"
    options:
      - "A. Komputa nwere ike imuta ihe ma mee mkpebi"
      - "B. Naani robot yiri mmadu"
      - "C. Anwansi na-eme ka komputa maa ihe"
      - "D. Otu udi app ekwenti"
    correct: 0

  - question: "Kedu ihe atu Naijiria na-egosi oru AI?"
    options:
      - "A. Iji ekwenti Nokia 3310"
      - "B. App ulo aku na-achoputa aghugho"
      - "C. Iji biro na akwukwo dee ihe"
      - "D. Isi nri jollof"
    correct: 1

  - question: "Kedu ka AI si amuta ihe?"
    options:
      - "A. Site na anwansi"
      - "B. Site n'ihu otutu ihe atu na usoro"
      - "C. Naani site n'akwukwo"
      - "D. O dighi mkpa ka o muta ihe"
    correct: 1

  - question: "Gini mere AI ji di mkpa maka Naijiria?"
    options:
      - "A. Naani n'Amerika ka o bara uru"
      - "B. O nwere ike inyere anyi aka idozi nsogbu anyi"
      - "C. Anyi achoghi ya ebe a"
      - "D. Naani nnukwu ulo oru nwere ike iji ya"
    correct: 1

  - question: "Gini ka AI NA-ENWEGHI ike ime ugbu a?"
    options:
      - "A. Imata ihu gi"
      - "B. Isughari asusu"
      - "C. Iche echiche kpomkwem ka uburu mmadu"
      - "D. Ichota usoro na data"
    correct: 2
