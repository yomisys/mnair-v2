id: day1_ai_tools_pid
day: 1
topic: ai_tools
language: pid
title: "AI Tools Wey You Fit Use Today"
content: |
  You no need to be programmer before you fit use AI! See free AI tools wey you fit start to use for your phone right now:

  CHATGPT (chat.openai.com):
  - Ask questions and get answers
  - Write emails, essays, or business plans
  - Translate between languages
  - E dey work for any phone browser, even with small data

  GOOGLE LENS:
  - Point your camera to text make e translate am
  - Identify plants, animals, or products
  - Scan and copy text from photos
  - Free for Android phones

  GRAMMARLY:
  - E dey check your English spelling and grammar
  - E dey help you write better emails and messages
  - Free version dey work well for basic needs

  CANVA AI:
  - Design posters, logos, and social media posts
  - AI dey suggest designs based on wetin you need
  - E good well well for small business owners

  GOOGLE TRANSLATE:
  - Translate between 100+ languages including Yoruba, Igbo, Hausa
  - E dey work offline if you download the language pack
  - E fit translate text wey dey inside photos

  These tools na FREE or dem get free versions. You fit use them for cheap Android phones with small data. The main thing na to start to experiment and learn!

  Remember: The best way to learn AI na to use am. Start today!

quiz:
  - question: "Wetin ChatGPT fit help you do?"
    options:
      - "A. Cook jollof rice"
      - "B. Answer questions and write text"
      - "C. Fix your gen"
      - "D. Send money"
    correct: 1

  - question: "Which AI tool fit translate text wey dey inside photo?"
    options:
      - "A. Calculator"
      - "B. Google Lens"
      - "C. Clock app"
      - "D. Contacts"
    correct: 1

  - question: "You need expensive phone before you fit use these AI tools?"
    options:
      - "A. Yes, na only iPhone"
      - "B. Yes, na only big Android"
      - "C. No, most of them dey work for cheap Android phones"
      - "D. You need laptop"
    correct: 2

  - question: "Wetin Grammarly dey help with?"
    options:
      - "A. Maths calculation"
      - "B. To check spelling and grammar"
      - "C. To play music"
      - "D. To make phone calls"
    correct: 1

  - question: "Google Translate fit work offline?"
    options:
      - "A. No, e no fit at all"
      - "B. Yes, if you download the language pack"
      - "C. Na only for America"
      - "D. Na only with premium subscription"
    correct: 1
