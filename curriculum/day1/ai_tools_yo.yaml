  - question: "Nje Google Translate le sise laisi intaneti?"
    options:
      - "A. Rara, lailai"
      - "B. Beeni, ti o ba gba idii ede sile"
      - "C. Ni Amerika nikan"
      - "D. Pelu sisanwo nikan"
    correct: 1
