day: 1
topic: ai_tools
language: yo
title: "Awon Irinse AI Ti O Le Lo Loni"
content: |
  O ko nilo lati je onimo eto komputa ki o to le lo AI! Eyi ni awon irinse AI ofe ti o le bere si lo lori foonu re lesekese:

  CHATGPT (chat.openai.com):
  - Beere ibeere ki o si gba idahun
  - Ko imeeli, arokọ, tabi eto isowo
  - Tumo laarin awon ede
  - O n sise lori browser foonu eyikeyii, koda pelu data kekere

  GOOGLE LENS:
  - Da kamera re ko si ọrọ lati tumo re
  - Da eweko, eranko, tabi oja mo
  - Sayan ki o si daako ọrọ lati inu foto
  - Ofe lori foonu Android

  GRAMMARLY:
  - O n se ayewo sipeli ati girama Geesi re
  - O n ran o lowo lati ko imeeli ati ifiranse to dara ju
  - Eya ofe n sise daradara fun awon ibeere ipilẹ

  CANVA AI:
  - Se apẹrẹ posita, aami, ati ifiweranṣẹ social media
  - AI n daba awon apẹrẹ da lori ohun ti o nilo
  - O dara pupo fun awon oniwun isowo kekere

  GOOGLE TRANSLATE:
  - Tumo laarin ede 100+ pelu Yoruba, Igbo, Hausa
  - O n sise laisi intaneti ti o ba gba idii ede sile
  - O le tumo ọrọ inu foto

  Awon irinse wonyi je OFE tabi won ni eya ofe. O le lo won lori foonu Android olowo poku pelu data kekere. Ohun pataki ni lati bere si dan won wo ati ko eko!

  Ranti: Ona ti o dara ju lati ko AI ni lati lo o. Bere loni!

quiz:
