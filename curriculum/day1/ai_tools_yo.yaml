  - question: "Nje o nilo foonu olowo nla lati lo awon irinse AI wonyi?"
    options:
      - "A. Beeni, iPhone nikan"
      - "B. Beeni, Android nla nikan"
      - "C. Rara, opolopo n sise lori foonu Android olowo poku"
      - "D. O nilo laptop"
