day: 1
topic: ai_tools
language: ha
title: "Kayan Aikin AI da Za Ka Iya Amfani da Su Yau"
content: |
  Ba sai ka zama mai shirye-shirye ba kafin ka yi amfani da AI! Ga kayan aikin AI kyauta da za ka fara amfani da su a wayarka yanzu:

  CHATGPT (chat.openai.com):
  - Yi tambayoyi ka samu amsoshi
  - Rubuta imel, makala, ko tsare-tsaren kasuwanci
  - Fassara tsakanin harsuna
  - Yana aiki a kowace burauzar waya, ko da karancin data

  GOOGLE LENS:
  - Nuna kyamararka ga rubutu don fassara shi
  - Gane tsirrai, dabbobi, ko kayayyaki
  - Duba da kwafe rubutu daga hotuna
  - Kyauta a wayoyin Android

  GRAMMARLY:
  - Yana duba kuskuren rubutu da nahawun Turancinka
  - Yana taimaka maka rubuta ingantattun imel da sakonni
  - Sigar kyauta na aiki sosai don bukatun yau da kullum

  CANVA AI:
  - Zana fosta, tambari, da hotunan social media
  - AI na ba da shawarar zane bisa abin da kake bukata
  - Yana da kyau ga masu kananan kasuwanci

  GOOGLE TRANSLATE:
  - Fassara tsakanin harsuna sama da 100 har da Yoruba, Igbo, Hausa
  - Yana aiki ba tare da intanet ba idan ka sauke fakitin harshe
  - Zai iya fassara rubutu a cikin hotuna

  Wadannan kayan aikin KYAUTA ne ko suna da sigar kyauta. Za ka iya amfani da su a wayoyin Android masu rahusa da karancin data. Babban abu shi ne ka fara gwadawa da koyo!

  Ka tuna: Hanya mafi kyau ta koyon AI ita ce amfani da shi. Fara yau!

quiz:
