day: 1
topic: how_ai_works
language: en
title: "How Does AI Work?"
content: |
  AI works by learning from data - lots and lots of examples. Imagine teaching a child what a mango is. You show them many mangoes until they can recognize any mango, even ones they've never seen before. AI learns the same way!

  The Three Steps of AI:

  1. DATA COLLECTION: Gather many examples
     - For face recognition: thousands of face photos
     - For language translation: millions of sentences
     - For fraud detection: records of past transactions

  2. TRAINING: The AI studies the patterns
     - Like how you learned that green + yellow often means "Lagos danfo"
     - AI finds patterns humans might miss
     - This is called "machine learning"

  3. PREDICTION: AI uses what it learned
     - Your phone predicts the next word when typing
     - YouTube recommends videos you might like
     - Banks predict if a transaction is suspicious

  Think of AI like agbero at motor park - after seeing thousands of passengers, he can quickly spot who's traveling far just by their luggage!

  The more good data AI sees, the better it becomes. Bad data creates bad AI - this is why quality matters.

