  - question: "Ki ni 'ikeko' (training) ninu AI?"
    options:
      - "A. Kiko eniyan lati ko eto komputa"
      - "B. Sisare lori ero idaraya"
      - "C. AI n ko awon ilana inu data"
      - "D. Fifi awon imudojuiwon sii"
