  - question: "Ki ni yoo sele ti AI ba ko eko pelu data buburu?"
    options:
      - "A. Yoo se asotele buburu"
      - "B. Yoo tun gbon sibe"
      - "C. Ko si ohun ti yoo yipada"
      - "D. Yoo tun ara re se"
