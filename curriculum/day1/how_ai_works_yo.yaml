day: 1
topic: how_ai_works
language: yo
title: "Bawo Ni AI Se N Sise?"
content: |
  AI n sise nipa kiko eko lati inu data - opolopo apeere. Foju inu wo bi o se n ko omode ohun ti mangoro je. Iwo yoo fi opolopo mangoro han an titi yoo fi le da mangoro eyikeyii mo, koda awon ti ko ti ri ri. Bee ni AI se n ko eko!

  Awon Igbese Meta ti AI:

  1. GBIGBA DATA: Ko opolopo apeere jo
     - Fun didamo oju: egbegberun foto oju
     - Fun itumo ede: miliọnu gbolohun oro
     - Fun riri jibiti: akosile awon isowo ti o ti koja

  2. IKEKO (TRAINING): AI yoo ko awon ilana
     - Bi o se ko pe alawo ewe ati ofeefee maa n tumo si "danfo Eko"
     - AI n ri awon ilana ti eniyan le ma ri
     - Eyi ni a n pe ni "machine learning"

  3. ASOTELE (PREDICTION): AI yoo lo ohun ti o ko
     - Foonu re n so asotele oro ti o kan nigbati o ba n te nkan
     - YouTube n daba awon fidio ti o le wu o
     - Awon banki n so asotele boya isowo kan ni ifura

  Wo AI bi agbero ni ibudo oko - leyin ti o ti ri egbegberun ero, o le yara mo eni ti o n rin irin-ajo jijin nipa eru won nikan!

  Bi AI se n ri data rere si, bee ni yoo se dara si. Data buburu n da AI buburu - idi niyen ti didara fi se pataki.

quiz:
