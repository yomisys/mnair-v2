day: 1
topic: how_ai_works
language: ig
title: "Kedu Ka AI Si Aru Oru?"
content: |
  AI na-aru oru site n'imuta ihe site na data - otutu otutu ihe atu. Chee na i na-akuziri nwata ihe mango bu. I ga-egosi ya otutu mango ruo mgbe o ga-amata mango obula, obuna ndi o na-ahubeghi mbu. Otu ahu ka AI si amuta ihe!

  Usoro Ato nke AI:

  1. ICHIKOTA DATA: Chikota otutu ihe atu
     - Maka imata ihu: otutu puku foto ihu
     - Maka isughari asusu: otutu nde ahiriokwu
     - Maka ichoputa aghugho: ndekorita azumahia gara aga

  2. OZUZU (TRAINING): AI na-amu usoro ndi ahu
     - Di ka i si muta na akwukwo ndu na edo edo na-aputakari "danfo Lagos"
     - AI na-achota usoro ndi mmadu nwere ike ighara ihu
     - Nke a ka a na-akpo "machine learning"

  3. IBU AMUMA (PREDICTION): AI na-eji ihe o mutara eme ihe
     - Ekwenti gi na-ebu amuma okwu ozo mgbe i na-ede ihe
     - YouTube na-atu aro vidiyo ndi i nwere ike imasi
     - Ulo aku na-ebu amuma ma azumahia o bu ihe na-enyo enyo

  Chee AI di ka agbero n'ogige ugboala - mgbe o hutachara otutu puku ndi njem, o nwere ike imata ngwa ngwa onye na-aga ebe di anya naani site n'ibu ya!

  Ka data oma AI na-ahu na-aba uba, ka o na-aka mma. Data ojoo na-emeputa AI ojoo - o bu ya mere idi mma ji di mkpa.

quiz:
