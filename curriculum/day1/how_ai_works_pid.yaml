day: 1
topic: how_ai_works
language: pid
title: "How AI Dey Work?"
content: |
  AI dey work by learning from data - plenty plenty examples. Imagine say you wan teach pikin wetin be mango. You go show am plenty mango until e fit recognize any mango, even the ones wey e never see before. Na so AI dey learn!

  The Three Steps of AI:

  1. DATA COLLECTION: Gather plenty examples
     - For face recognition: thousands of face photos
     - For language translation: millions of sentences
     - For fraud detection: records of past transactions

  2. TRAINING: AI go study the patterns
     - Like how you learn say green and yellow many times mean "Lagos danfo"
     - AI dey find patterns wey human being fit miss
     - Na this one dem dey call "machine learning"

  3. PREDICTION: AI go use wetin e learn
     - Your phone dey predict the next word when you dey type
     - YouTube dey recommend videos wey you fit like
     - Banks dey predict if transaction dey suspicious

  Think of AI like agbero for motor park - after e don see thousands of passengers, e fit quickly spot who dey travel far just by their load!

  The more good data AI see, the better e go become. Bad data dey create bad AI - na why quality matter.

