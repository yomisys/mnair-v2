id: day1_what_is_ai_yo
day: 1
topic: what_is_ai
language: yo
title: "Ki Ni Artificial Intelligence (AI)?"
content: |
  Artificial Intelligence (AI) ni nigba ti komputa ati ero le se awon nkan ti o maa n nilo ogbon eniyan. Ronu re bi kiko komputa lati ko eko, ronu, ati se ipinnu.

  Ni Naijiria, AI ti wa ni ayika re tele! Nigbati app banki re ba ri jibiti, nigbati Google ba tumo Yoruba si Geesi, tabi nigbati foonu re ba da oju re mo - AI ni o n sise.

  Ohun ti AI le se:
  - Da awon ilana mo (bi mimo owo naira ayederu)
  - So asotele (bi asotele oju-ojo fun awon agbe)
  - Loye ede (bi chatbot ti o n dahun ibeere)
  - Ri ati da nkan mo (bi kamera ti o n ka nomba oko)

  AI kii se idan tabi roboti ti o dabi eniyan. Eto komputa ni ti o n ko eko lati inu data lati yanju isoro kan pato. Gege bi o ti ko bi a se n gun okada nipase adase, bee ni AI n ko eko nipa riri opolopo apeere.

  Naijiria nilo imo AI! Lati oko de ile-iwosan, banki de ile-iwe - AI le ran wa lowo lati yanju awon isoro wa. Idi niyen ti o fi n ko eyi!

quiz:
