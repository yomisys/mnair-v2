day: 1
topic: ai_tools
language: ig
title: "Ngwa AI I Nwere Ike Iji Taa"
content: |
  I kwesighi ibu onye mmemme tupu i jiri AI! Lee ngwa AI efu ndi i nwere ike ibido iji na ekwenti gi ugbu a:

  CHATGPT (chat.openai.com):
  - Juo ajuju ma nweta aziza
  - Dee imel, edemede, ma o bu atumatu azumahia
  - Sugharia n'etiti asusu
  - O na-aru oru na browser ekwenti obula, obuna na obere data

  GOOGLE LENS:
  - Tuo igwefoto gi n'ihe edere iji sugharia ya
  - Mata ahihia, anumanu, ma o bu ngwaahia
  - Nyochaa ma detuo ihe edere site na foto
  - Efu na ekwenti Android

  GRAMMARLY:
  - O na-enyocha nsupe na utoasusu Bekee gi
  - O na-enyere gi aka ide imel na ozi ka mma
  - Udi efu na-aru oru nke oma maka mkpa ndi di mfe

  CANVA AI:
  - Mee atumatu posta, akara, na ihe nkesa social media
  - AI na-atu aro atumatu dabere n'ihe i choro
  - O di mma nke ukwuu maka ndi nwe obere azumahia

  GOOGLE TRANSLATE:
  - Sugharia n'etiti asusu 100+ tinyere Yoruba, Igbo, Hausa
  - O na-aru oru na-enweghi intaneti ma i budata ngwugwu asusu
  - O nwere ike isughari ihe edere n'ime foto

  Ngwa ndi a bu EFU ma o bu nwee udi efu. I nwere ike iji ha na ekwenti Android di onu ala na obere data. Isi ihe bu ibido inwale na imuta!

  Cheta: Uzo kacha mma isi muta AI bu iji ya. Bido taa!

