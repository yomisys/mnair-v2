day: 4
topic: ai_ethics
language: en
title: "Deepfakes and Fake News: Staying Sharp in the AI Age"
content: |
  AI can now create fake videos of real people saying things they never said. In an election season or a family WhatsApp group, this is dangerous. Today: how to protect yourself and others.

  WHAT AI CAN FAKE TODAY:
  - VIDEOS: A politician "confessing" to crimes - face and voice cloned
  - AUDIO: A "kidnapper" using your relative's cloned voice demanding ransom
  - IMAGES: Fake photos of events that never happened
  - TEXT: Thousands of fake social media accounts spreading coordinated lies

  REAL NIGERIAN RISKS:
  - Election misinformation designed to cause unrest
  - "Celebrity investment endorsements" - fake videos of famous Nigerians promoting fraud schemes
  - Voice-clone scam calls to family members
  - Fake "breaking news" images during emergencies

  YOUR DEFENSE KIT - 6 CHECKS:
  1. SOURCE: Who posted this first? Established news house or anonymous account?
  2. CROSS-CHECK: Is ANY credible outlet reporting it? If only one source - wait
  3. LOOK CLOSE: AI videos often have odd blinking, mismatched lip-sync, strange hands
  4. EMOTION TEST: Content designed to make you VERY angry or VERY afraid is often manipulation
  5. REVERSE SEARCH: Google Lens can show if an "event photo" is actually from 2015
  6. FAMILY CODE WORD: Agree on a secret question with relatives to defeat voice-clone scams

  BEFORE YOU FORWARD:
  That "share fast!" message in the family group? Check it first. Forwarding fake news makes YOU part of the problem - and Nigerian law now addresses spreading false information.

  Be the person in your community who verifies. In the AI age, that's a superpower.

