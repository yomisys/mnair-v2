day: 4
topic: ai_tools
language: ig
title: "Oru Aka: Inweta Ezigbo Aziza Site na Ngwa AI"
content: |
  I maara na ngwa ndi ahu di. Taa, muta iji ha eme ihe NKE OMA. Ihe di iche n'etiti aziza AI adighi mma na nke kacha mma bu otu i si aju - "prompt" gi.

  PROMPT NA-ADIGHI IKE:
  "Gwa m banyere azumahia" → aziza efu, na-abaghi uru.

  PROMPT SIRI IKE - IHE 4:
  1. ORU: "I bu onye ndumodu azumahia maka obere azumahia Naijiria"
  2. ORU A GA-ARU: "Mepu atumatu mgbasa ozi otu izu"
  3. GBURUGBURU: "maka ebe suya m na Ibadan, ego naira 20,000, ndi ahia m bu umu akwukwo"
  4. USORO: "di ka ndeko onuogugu nwere ugwo kwa ubochi"

  Jikota ha niile: atumatu kpomkwem bara uru ga-aputa! Nwalee ya taa.

  AGHUGHO PROMPT NDI OZO:
  - RIO MAKA NZOPUTA: "Kowaa ka onye mbido kpamkpam, nzoputa na nzoputa"
  - NYE IHE ATU: "Lee ozi m dere na mbu... dee nke yiri ya maka X"
  - MEGHARIA: O buru na aziza ezughi oke, zaa "Mee ka o di mkpirikpi" ma o bu "Tinye ihe atu Naijiria"
  - SUGHARIA: "Kowaa nke a n'asusu Igbo di mfe" na-aru oru nke oma!

  ORU NDI I NWERE IKE IME TAA:
  - Umu akwukwo: "Mepu ajuju omume 10 na [isiokwu] nwere aziza a kowara"
  - Ndi na-acho oru: "Meziwanye nchikota CV a maka oru ire ahia: [tinye nke gi]"
  - Ndi nwe azumahia: "Dee aziza di nsopuru nye mkpesa onye ahia a: [tinye ya]"
  - Ndi nne na nna: "Tuo aro atumatu nri kwa izu site na nri Naijiria n'okpuru naira 15,000"

  NCHETA NCHEKWA:
  - Etinyela paswọd, BVN, ma o bu akwukwo nzuzo n'ime ngwa AI ma oli
  - Nyochaa eziokwu tupu i jiri ha mee ihe (cheta hallucination!)
  - AI na-ede ihe odide, GI na-ekpebi. Na-enyocha mgbe niile tupu izipu.

  Muta prompting nke oma, i nwetala nka ndi na-ewe mmadu n'oru na-edeputa na mgbasa ozi oru ugbu a!

