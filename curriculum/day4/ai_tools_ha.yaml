day: 4
topic: ai_tools
language: ha
title: "Aiki Kai Tsaye: Samun Kyawawan Amsoshi daga Kayan Aikin AI"
content: |
  Ka san kayan aikin suna nan. Yau, koyi amfani da su YADDA YA KAMATA. Bambanci tsakanin amsar AI mara kyau da mai kyau galibi yadda ka tambaya ne - "prompt" dinka.

  PROMPT MAI RAUNI:
  "Gaya mini game da kasuwanci" → amsa ta gama-gari, mara amfani.

  PROMPT MAI KARFI - SINADARAI 4:
  1. MATSAYI: "Kai mai ba da shawarar kasuwanci ne ga kananan kasuwancin Najeriya"
  2. AIKI: "Kirkiri tsarin talla na mako daya"
  3. MAHALLI: "don wurin suya na a Ibadan, kasafin naira 20,000, abokan ciniki dalibai ne"
  4. TSARI: "a matsayin jerin lambobi tare da kudin yau da kullum"

  Hada su wuri daya: tsari na musamman mai amfani zai bayyana! Gwada yau.

  KARIN DABARUN PROMPT:
  - NEMI MATAKAI: "Bayyana kamar ni sabon mai koyo ne, mataki-mataki"
  - BA DA MISALAI: "Ga sakon da na rubuta a baya... rubuta makamancinsa don X"
  - MAIMAITA: Idan amsar ba ta yi daidai ba, amsa "Takaita shi" ko "Karin misalan Najeriya"
  - FASSARA: "Bayyana wannan da Hausa mai sauki" na aiki sosai!

  AYYUKAN GASKE DA ZA KA IYA YI YAU:
  - Dalibai: "Kirkiri tambayoyin gwaji 10 kan [batu] tare da amsoshi da bayani"
  - Masu neman aiki: "Inganta wannan takaitaccen CV don aikin sayarwa: [lika naka]"
  - Masu kasuwanci: "Rubuta amsa mai ladabi ga wannan korafin abokin ciniki: [lika shi]"
  - Iyaye: "Ba da shawarar tsarin abinci na mako da abincin Najeriya kasa da naira 15,000"

  TUNATARWAR TSARO:
  - Kada ka taba lika kalmomin sirri, BVN, ko takardun sirri a kayan aikin AI
  - Tabbatar da gaskiya kafin aiki da su (ka tuna hallucination!)
  - AI na rubuta daftari, KAI ke yanke shawara. Duba koyaushe kafin aikawa.

  Kware a prompting ka sami kwarewar da masu daukar ma'aikata ke lissafawa a tallace-tallacen ayyuka yanzu!

