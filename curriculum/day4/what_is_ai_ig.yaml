day: 4
topic: what_is_ai
language: ig
title: "Ezinaulo Ano nke AI I Na-Ezute Kwa Ubochi"
content: |
  Ugbu a i maara na AI na-amuta site na data. Taa, zute nnukwu EZINAULO ano nke AI - ka i wee mata nke i na-emekorita ya ebe obula.

  1. VISION AI (AI na-ahu uzo):
  O na-aghota foto na vidiyo. Ihe atu: imeghe ekwenti n'ihu, igu nomba ugboala, ichoputa oria ihe okuku site na foto, ndi dokita ji AI agu X-ray. O buru na igwe "lere" ihe anya ma ghota ya - nke ahu bu vision AI.

  2. SPEECH AI (AI na-anu ma na-ekwu okwu):
  O na-agbanwe okwu ka o buru ihe edere na ihe edere ka o buru okwu. Ihe atu: idekwu olu, Siri na Google Assistant, ndepe okwu na vidiyo, bots ulo oru oku. Speech AI maka olu Naijiria na-akawanye mma kwa afo ka data olu anyi na-amubawanye.

  3. LANGUAGE AI (AI na-agu ma na-ede):
  O na-aghota ma na-emeputa ihe edere. Ihe atu: ChatGPT, Google Translate, nzacha spam imel, ndeju okwu n'onwe ya. Ezinaulo a gbawara agbawa mgbe 2022 gachara - ndi a bu "Large Language Models" (LLMs) a ma ama.

  4. PREDICTION AI (AI na-ebu amuma):
  O na-achota usoro n'onuogugu iji buo amuma odiniru. Ihe atu: ikimanye kredit, ichoputa aghugho, amuma ihu igwe, amuma mkpọchi uzo Lagos, itu aro vidiyo ozo.

  IJIKOTA EZINAULO:
  AI oge a na-ejikotakari ezinaulo. Onye inyeaka olu WhatsApp nke nuru ajuju Igbo gi (okwu), ghota ya (asusu), lelee akaunt gi (amuma), ma zaa gi n'olu dara uda (okwu ozo)!

  GINI MERE O JI DI MKPA:
  Mgbe i nuru banyere ngwaahia AI ohuru, juo: "Kedu ezinaulo bu nke a? Kedu data zuru ya?" I ga-aghota akuko teknuzu karia otutu mmadu - mgbe naani ubochi 4 nke omumu gachara!

