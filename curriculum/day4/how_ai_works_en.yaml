day: 4
topic: how_ai_works
language: en
title: "Inside a Chatbot: How ChatGPT Answers You"
content: |
  You ask ChatGPT "How do I start a poultry business in Nigeria?" and seconds later, a full answer appears. What happened in those seconds? Let's open the bonnet!

  STEP 1 - BREAKING YOUR WORDS INTO TOKENS:
  The AI splits your message into small pieces called tokens (roughly word-parts). "Poultry" might become "poul" + "try". Computers work with numbers, so each token becomes a number.

  STEP 2 - UNDERSTANDING CONTEXT:
  The model compares your tokens against patterns from its training - trillions of words from books, websites, and articles. It recognizes: this is a question + about business + specifically poultry + location Nigeria. Context matters: "start" here means establishing, not starting a car!

  STEP 3 - PREDICTING THE ANSWER, ONE TOKEN AT A TIME:
  Here's the secret: ChatGPT writes by predicting the next token, over and over. Like your keyboard's word suggestion, but trained on so much data that the predictions form intelligent, complete answers. It writes "To start a poultry..." then predicts "business", then "in", then "Nigeria"...

  STEP 4 - SAFETY CHECKS:
  Good AI systems filter harmful or false content before showing the answer.

  THE BIG LIMITATION - "HALLUCINATION":
  Because the AI predicts likely-sounding words, it sometimes generates confident-sounding but FALSE information - like quoting a Nigerian law that doesn't exist! It's not lying - it's predicting patterns without truly "knowing" facts.

  RULE: Use chatbots for ideas, drafts, and explanations. Verify important facts (laws, medical advice, prices) from official sources. The AI is your assistant, not your final authority.

