title: "Deepfakes ati Iroyin Iro: Jije Olomo Inu ni Akoko AI"
content: |
  AI le da fidio iro sile bayii ti awon eniyan gidi n so ohun ti won ko so ri. Ni akoko idibo tabi ninu egbe WhatsApp ebi, eyi lewu. Loni: bi o se le dabobo ara re ati awon elomiran.

  OHUN TI AI LE SE NI IRO LONI:
  - FIDIO: Oloselu ti n "jẹwọ" iwa ọdaran - oju ati ohun ti a daako
  - OHUN: "Ajinigbe" ti n lo ohun ebi re ti a daako lati beere owo irapada
  - AWORAN: Foto iro ti isele ti ko sele ri
  - ỌRỌ: Egbegberun akaunti social media iro ti n tan iro kale

  AWON EWU NAIJIRIA GIDI:
  - Iroyin iro idibo ti a gbero lati fa rogbodiyan
  - "Ijẹrisi idokowo olokiki" - fidio iro ti awon gbajumo Naijiria ti n polowo ete jibiti
  - Ipe jibiti ohun ti a daako si awon ebi
  - Aworan "iroyin kiakia" iro lasiko pajawiri

  OHUN IJA AABO RE - AYEWO 6:
  1. ORISUN: Ta lo koko fi sile? Ile iroyin ti a mo tabi akaunti alailorukọ?
  2. AYEWO AGBELEBU: Nje ile iroyin olokiki kan n royin re? Ti orisun kan pere ba ni - duro na
  3. WO DAADAA: Fidio AI maa n ni iseju ajeji, ete ti ko ba ọrọ mu, owo ajeji
  4. IDANWO IMOLARA: Ohun ti a gbero lati mu o BINU gidigidi tabi BERU gidigidi maa n je ifọwọyi
  5. WIWA PADA: Google Lens le fi han o boya "foto isele" je ti 2015 gangan
  6. ỌRỌ ASIRI EBI: Fi enu ko lori ibeere asiri pelu awon ebi lati segun jibiti ohun ti a daako

  KI O TO FI RANSE SIWAJU:
  Ifiranse "pin kiakia!" yen ninu egbe ebi? Se ayewo re na. Fifi iroyin iro ranse siwaju so O di ara isoro naa - ofin Naijiria si n koju itankale iro bayii.

  Je eni ti n se idaniloju ni agbegbe re. Ni akoko AI, agbara nla niyen.

