day: 4
topic: what_is_ai
language: ha
title: "Iyalai Hudu na AI da Kake Haduwa da Su Kullum"
content: |
  Yanzu ka san AI na koyo daga bayanai. Yau, ka hadu da manyan IYALAI hudu na AI - don ka iya gane wanda kake mu'amala da shi a ko'ina.

  1. VISION AI (AI mai gani):
  Yana fahimtar hotuna da bidiyo. Misalai: bude waya da fuska, karanta lambar mota, gano cututtukan amfanin gona daga hotuna, likitoci masu amfani da AI don karanta X-ray. Idan inji ya "kalli" wani abu ya fahimce shi - vision AI ke nan.

  2. SPEECH AI (AI mai ji da magana):
  Yana mai da magana zuwa rubutu da rubutu zuwa magana. Misalai: rubutu da murya, Siri da Google Assistant, rubutun kasa na bidiyo kai tsaye, bots na cibiyar kira. Speech AI na lafazin Najeriya na ingantuwa kowace shekara yayin da bayanan muryarmu ke karuwa.

  3. LANGUAGE AI (AI mai karatu da rubutu):
  Yana fahimta da samar da rubutu. Misalai: ChatGPT, Google Translate, tace spam na imel, cika kalmomi kai tsaye. Wannan iyali ya fashe bayan 2022 - wadannan su ne shahararrun "Large Language Models" (LLMs).

  4. PREDICTION AI (AI mai hasashe):
  Yana samun alamu a cikin lambobi don hasashen gaba. Misalai: kimanta bashi, gano zamba, hasashen yanayi, hasashen cunkoson Lagos, ba da shawarar bidiyo na gaba.

  HADA IYALAI:
  AI na zamani yakan hada iyalai. Mataimakin muryar WhatsApp da ke jin tambayarka ta Hausa (magana), ya fahimce ta (harshe), ya duba asusunka (hasashe), ya amsa maka da babbar murya (magana kuma)!

  DALILIN MUHIMMANCI:
  Idan ka ji labarin sabon kayan AI, tambaya: "Wane iyali ne wannan? Wadanne bayanai suka horar da shi?" Za ka fahimci labaran fasaha fiye da yawancin mutane - bayan kwanaki 4 kawai na koyo!

