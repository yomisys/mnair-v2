day: 4
topic: how_ai_works
language: ig
title: "Ime Chatbot: Otu ChatGPT Si Aza Gi"
content: |
  I juru ChatGPT "Kedu ka m ga-esi bido azumahia okuko na Naijiria?" n'ime sekond ole na ole, aziza zuru oke putara. Gini mere n'ime sekond ndi ahu? Ka anyi meghee injin ya!

  NZOPUTA 1 - IKEWA OKWU GI KA HA BURU TOKENS:
  AI na-ekewa ozi gi ka o buru obere iberibe a na-akpo tokens (ihe di ka akuku okwu). "Poultry" nwere ike ighö "poul" + "try". Komputa na-eji onuogugu aru oru, ya mere token obula na-aghö onuogugu.

  NZOPUTA 2 - IGHOTA GBURUGBURU OKWU:
  Model na-atunyere tokens gi na usoro si n'ozuzu ya - otutu ijeri ijeri okwu si n'akwukwo, weebusaiti, na edemede. O na-amata: nke a bu ajuju + banyere azumahia + kpomkwem okuko + ebe Naijiria. Gburugburu okwu di mkpa: "bido" ebe a putara ihiwe, o bughi ibido ugboala!

  NZOPUTA 3 - IBU AMUMA AZIZA, OTU TOKEN N'OTU OGE:
  Lee ihe nzuzo: ChatGPT na-ede site n'ibu amuma token ozo, ugboro ugboro. Di ka ntu aro okwu nke keyboard gi, mana e ji nnukwu data zuo ya nke na amuma ndi ahu na-aghö aziza nwere ogugu isi ma zuru oke.

  NZOPUTA 4 - NLELE NCHEKWA:
  Ezigbo sistem AI na-azacha ihe na-emeru ahu ma o bu ihe ugha tupu ha egosi aziza.

  NNUKWU MMACHI - "HALLUCINATION":
  N'ihi na AI na-ebu amuma okwu ndi yiri eziokwu, mgbe ufodu o na-emeputa ozi UGHA nke na-ada ka eziokwu - di ka ikwuputa iwu Naijiria nke na-adighi adi! O naghi agha ugha - o na-ebu amuma usoro na-enweghi "imata" eziokwu n'ezie.

  IWU: Jiri chatbots maka echiche, ihe odide, na nkowa. Nyochaa eziokwu ndi di mkpa (iwu, ndumodu ahuike, onu ahia) site n'isi mmalite gọọmenti. AI bu onye inyeaka gi, o bughi ikike ikpeazu gi.

