day: 4
topic: what_is_ai
language: pid
title: "The Four Families of AI Wey You Dey Meet Every Day"
content: |
  By now you know say AI dey learn from data. Today, meet the four big FAMILIES of AI - so you go fit recognize which one you dey deal with anywhere.

  1. VISION AI (AI wey dey see):
  E dey understand images and video. Examples: face unlock, reading vehicle plates, detecting crop diseases from photos, doctors wey dey use AI read X-rays. If machine "look" something and understand am - na vision AI be that.

  2. SPEECH AI (AI wey dey hear and talk):
  E dey convert speech to text and text to speech. Examples: voice typing, Siri and Google Assistant, automatic subtitles for videos, call-center bots. Speech AI for Naija accents dey improve every year as more of our voice data dey available.

  3. LANGUAGE AI (AI wey dey read and write):
  E dey understand and generate text. Examples: ChatGPT, Google Translate, email spam filters, autocomplete. This family blow after 2022 - na the famous "Large Language Models" (LLMs) be this.

  4. PREDICTION AI (AI wey dey forecast):
  E dey find patterns inside numbers to predict the future. Examples: credit scoring, fraud detection, weather forecasts, Lagos traffic predictions, recommending the next video.

  MIXING FAMILIES:
  Modern AI dey often combine families. WhatsApp voice assistant wey hear your Hausa question (speech), understand am (language), check your account (prediction), and reply you out loud (speech again)!

  WHY E MATTER:
  When you hear about new AI product, ask: "Which family be this? Which data train am?" You go understand technology news pass most people - after just 4 days of learning!

quiz:
