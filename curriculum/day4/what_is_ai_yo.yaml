day: 4
topic: what_is_ai
language: yo
title: "Idile Merin ti AI Ti O N Pade Lojoojumo"
content: |
  Bayii o ti mo pe AI n ko eko lati inu data. Loni, pade awon IDILE nla merin ti AI - ki o le mo eyi ti o n ba lo nibikibi.

  1. VISION AI (AI ti n riran):
  O n loye aworan ati fidio. Apeere: sisi foonu pelu oju, kika nomba oko, riri arun eweko lati inu foto, awon dokita ti n lo AI lati ka X-ray. Ti ero ba "wo" nkan ti o si loye re - vision AI niyen.

  2. SPEECH AI (AI ti n gbo ti o si n sọrọ):
  O n yi ọrọ sisọ pada si kikọ ati kikọ pada si ọrọ sisọ. Apeere: titẹ pelu ohun, Siri ati Google Assistant, akọle fidio laifowoyi, bots ile-ise ipe. Speech AI fun ohun Naijiria n dara si lodoodun bi data ohun wa se n po si.

  3. LANGUAGE AI (AI ti n ka ti o si n kọ):
  O n loye, o si n da ọrọ sile. Apeere: ChatGPT, Google Translate, ase spam imeeli, ipari ọrọ laifowoyi. Idile yii gbamu leyin 2022 - awon wonyi ni awon gbajumo "Large Language Models" (LLMs).

  4. PREDICTION AI (AI ti n so asotele):
  O n ri awon ilana ninu nomba lati so asotele ojo iwaju. Apeere: iwon kirediti, riri jibiti, asotele oju-ojo, asotele ijabọ Eko, didaba fidio ti o kan.

  DIDAPO AWON IDILE:
  AI ode oni maa n da awon idile po. Oluranlowo ohun WhatsApp ti o gbo ibeere Yoruba re (ọrọ sisọ), loye re (ede), wo akaunti re (asotele), ti o si dahun soke (ọrọ sisọ leekan si)!

  IDI TI O FI SE PATAKI:
  Nigbati o ba gbo nipa oja AI titun, beere: "Idile wo ni eyi? Data wo lo ko o?" Iwo yoo loye iroyin imo-ero ju opolopo eniyan lo - leyin ojo 4 pere ti kiko eko!

