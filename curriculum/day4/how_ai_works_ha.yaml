      - "D. Lokacin da AI ke aiki da sauri"
    correct: 0

  - question: "Me ya kamata ka yi da muhimman bayanai daga chatbot?"
    options:
      - "A. Gaskata su nan take"
      - "B. Tabbatar da su daga tushe na hukuma"
      - "C. Raba su nan take"
      - "D. Kada ka taba amfani da chatbots"
    correct: 1

  - question: "Yaya ya kamata ka dauki AI chatbots?"
    options:
      - "A. A matsayin hukuncinka na karshe a komai"
      - "B. A matsayin mataimaki don ra'ayoyi da daftari"
      - "C. A matsayin kayan wasa marasa amfani"
      - "D. A matsayin maye gurbin dukkan likitoci"
    correct: 1
