day: 4
topic: how_ai_works
language: ha
title: "Cikin Chatbot: Yadda ChatGPT Ke Amsa Maka"
content: |
  Ka tambayi ChatGPT "Ta yaya zan fara kasuwancin kaji a Najeriya?" cikin dakikoki, cikakkiyar amsa ta bayyana. Me ya faru a cikin wadancan dakikokin? Bari mu bude injin!

  MATAKI 1 - RABA KALMOMINKA ZUWA TOKENS:
  AI na raba sakonka zuwa kananan guda da ake kira tokens (kamar sassan kalmomi). "Poultry" na iya zama "poul" + "try". Kwamfutoci na aiki da lambobi, don haka kowane token ya zama lamba.

  MATAKI 2 - FAHIMTAR MAHALLI:
  Modelin na kwatanta tokens dinka da alamu daga horonsa - tiriliyoyin kalmomi daga littattafai, shafukan yanar gizo, da makaloli. Yana ganewa: wannan tambaya ce + game da kasuwanci + musamman kaji + wuri Najeriya. Mahalli na da muhimmanci: "fara" a nan na nufin kafawa, ba tada mota ba!

  MATAKI 3 - HASASHEN AMSA, TOKEN DAYA BAYAN DAYA:
  Ga sirrin: ChatGPT na rubutu ta hasashen token na gaba, akai-akai. Kamar shawarar kalmar keyboard dinka, amma an horar da shi da bayanai masu yawa har hasashen na zama amsoshi masu hankali da cikakku.

  MATAKI 4 - DUBAN TSARO:
  Kyawawan tsarin AI na tace abubuwa masu cutarwa ko karya kafin nuna amsar.

  BABBAN IYAKA - "HALLUCINATION":
  Saboda AI na hasashen kalmomin da suka yi kama da gaskiya, wani lokaci yana samar da bayanan KARYA da suka yi kama da tabbaci - kamar ambaton dokar Najeriya da ba ta wanzu! Ba karya yake yi ba - yana hasashen alamu ne kawai ba tare da "sanin" gaskiya da gaske ba.

  DOKA: Yi amfani da chatbots don ra'ayoyi, daftari, da bayani. Tabbatar da muhimman bayanai (dokoki, shawarwarin lafiya, farashi) daga tushe na hukuma. AI mataimakinka ne, ba hukuncinka na karshe ba.

