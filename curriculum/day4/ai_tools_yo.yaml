day: 4
topic: ai_tools
language: yo
title: "Ise Gangan: Gbigba Idahun To Dara Lati Awon Irinse AI"
content: |
  O mo pe awon irinse naa wa. Loni, ko bi a se n lo won DARADARA. Iyato laarin idahun AI ti ko dara ati eyi to dara julo ni bi o se beere - "prompt" re.

  PROMPT ALAILAGBARA:
  "So fun mi nipa isowo" → idahun lasan, ti ko wulo.

  PROMPT ALAGBARA - EROJA 4:
  1. IPA: "Iwo je oludamoran isowo fun awon isowo kekere Naijiria"
  2. ISE: "Da eto ipolowo ose kan sile"
  3. AYIKA: "fun ibi suya mi ni Ibadan, isuna naira 20,000, awon onibara mi je akeko"
  4. ILANA: "gege bi akojọ nomba pelu owo ojoojumo"

  Da gbogbo re po: eto pataki to wulo yoo farahan! Dan an wo loni.

  AWON OGBON PROMPT MIIRAN:
  - BEERE FUN IGBESE: "Salaye bi eni pe alakọbẹrẹ patapata ni mi, ni igbese-igbese"
  - FUN NI APEERE: "Eyi ni ifiranse ti mo ko teletele... ko iru re fun X"
  - TUNSE: Ti idahun ko ba pe, dahun "Mu ki o kuru" tabi "Fi apeere Naijiria kun"
  - TUMO: "Salaye eyi ni ede Yoruba ti o rọrun" n sise daradara!

  AWON ISE GIDI TI O LE SE LONI:
  - Awon akeko: "Da ibeere idanrawo 10 sile lori [koko] pelu idahun ti a salaye"
  - Awon ti n wa ise: "Mu akotan CV yii dara si fun ipo titaja: [le tire sibe]"
  - Awon oniṣowo: "Ko idahun onitẹriba si ẹdun onibara yii: [le e sibe]"
  - Awon obi: "Daba eto ounje ọsọọsẹ pelu ounje Naijiria ti o wọpọ labe naira 15,000"

  IRANTI AABO:
  - Ma se le ọrọ igbaniwole, BVN, tabi iwe asiri sinu irinse AI lailai
  - Se idaniloju otito ki o to gbe igbese lori won (ranti hallucination!)
  - AI n kọ akọsilẹ, IWO lo n pinnu. Maa se atunyẹwo nigbagbogbo ki o to fi ranse.

  Mo prompting daradara, o si ti ni imo ti awon agbanisise n ko sinu ipolowo ise bayii!

