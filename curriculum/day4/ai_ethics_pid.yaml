language: pid
title: "Deepfakes and Fake News: How to Stay Sharp for AI Age"
content: |
  AI fit now create fake videos of real people wey dey talk things wey dem never talk. For election season or family WhatsApp group, this one dangerous. Today: how to protect yourself and others.

  WETIN AI FIT FAKE TODAY:
  - VIDEOS: Politician wey dey "confess" crimes - face and voice wey dem clone
  - AUDIO: "Kidnapper" wey dey use your relative cloned voice demand ransom
  - IMAGES: Fake photos of events wey never happen
  - TEXT: Thousands of fake social media accounts wey dey spread coordinated lies

  REAL NAIJA RISKS:
  - Election misinformation wey dem design to cause wahala
  - "Celebrity investment endorsements" - fake videos of famous Nigerians wey dey promote fraud schemes
  - Voice-clone scam calls to family members
  - Fake "breaking news" images during emergencies

  YOUR DEFENSE KIT - 6 CHECKS:
  1. SOURCE: Who post am first? Established news house or anonymous account?
  2. CROSS-CHECK: Any credible outlet dey report am? If na only one source - wait first
  3. LOOK CLOSE: AI videos dey often get strange blinking, lip-sync wey no match, strange hands
  4. EMOTION TEST: Content wey dem design to make you VERY angry or VERY afraid na often manipulation
  5. REVERSE SEARCH: Google Lens fit show you if "event photo" na actually from 2015
  6. FAMILY CODE WORD: Agree secret question with your relatives to defeat voice-clone scams

  BEFORE YOU FORWARD:
  That "share fast!" message for family group? Check am first. If you forward fake news, YOU don become part of the problem - and Naija law now dey address spreading false information.

  Be the person for your community wey dey verify. For the AI age, na superpower be that.

quiz:
  - question: "Wetin be deepfake?"
    options:
      - "A. Fake video, audio, or images of real people wey AI generate"
      - "B. Deep borehole"
      - "C. Fishing technique"
      - "D. One type of dance"
    correct: 0

  - question: "Which one be sign say video fit be AI-generated?"
    options:
      - "A. Strange blinking and lip-sync wey no match"
      - "B. Good lighting"
      - "C. E get sound"
      - "D. E dey in color"
    correct: 0

  - question: "Wetin be the 'emotion test'?"
    options:
      - "A. Content wey dem design to make you very angry or afraid na often manipulation"
      - "B. To cry during films"
      - "C. Hospital test"
      - "D. To test your phone speed"
    correct: 0

  - question: "How family code word fit protect you?"
    options:
      - "A. E dey defeat voice-clone scam calls wey dey pretend to be relatives"
      - "B. E dey make calls cheaper"
      - "C. E dey improve network signal"
      - "D. E no fit help"
    correct: 0

  - question: "Wetin you suppose do before you forward shocking news?"
    options:
      - "A. Forward am as fast as possible"
      - "B. Verify am from credible sources first"
      - "C. Add more exclamation marks"
      - "D. Translate am first"
    correct: 1
