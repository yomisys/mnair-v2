title: "Deepfakes da Labaran Karya: Zama Mai Hankali a Zamanin AI"
content: |
  AI yanzu na iya kirkirar bidiyon karya na mutane na gaske suna fadin abubuwan da ba su taba fada ba. A lokacin zabe ko a kungiyar WhatsApp ta iyali, wannan yana da hadari. Yau: yadda za ka kare kanka da sauran mutane.

  ABIN DA AI ZAI IYA KIRKIRA YAU:
  - BIDIYO: Dan siyasa yana "ikirari" da laifuka - fuska da murya da aka kwaikwaya
  - SAUTI: "Dan garkuwa" mai amfani da muryar dan uwanka da aka kwaikwaya don neman kudin fansa
  - HOTUNA: Hotunan karya na abubuwan da ba su taba faruwa ba
  - RUBUTU: Dubban asusun social media na karya masu yada karairayi

  HADURRAN NAJERIYA NA GASKE:
  - Labaran karya na zabe da aka tsara don haifar da tashin hankali
  - "Tabbacin saka hannun jari na shahararru" - bidiyon karya na shahararrun 'yan Najeriya masu tallata zamba
  - Kiran zamba da muryar da aka kwaikwaya zuwa 'yan uwa
  - Hotunan "labari mai zafi" na karya yayin gaggawa

  KAYAN KARIYARKA - DUBA 6:
  1. TUSHE: Wa ya fara wallafawa? Gidan labarai sananne ko asusun boye?
  2. TANTANCEWA: Shin wani sanannen kafofin yada labarai na bayar da rahoto? Idan tushe daya ne kawai - jira
  3. DUBA SOSAI: Bidiyon AI yakan samu kyaftawa mara kyau, lebba da ba su dace da magana ba, hannaye masu ban mamaki
  4. GWAJIN MOTSIN RAI: Abun da aka tsara don sa ka FUSHI sosai ko TSORO sosai galibi yaudara ce
  5. BINCIKEN HOTO: Google Lens na iya nuna ko "hoton wani lamari" daga 2015 ne
  6. KALMAR SIRRI TA IYALI: Ku amince da tambayar sirri da 'yan uwa don kayar da zambar muryar da aka kwaikwaya

  KAFIN KA TURA:
  Sakon nan na "raba da sauri!" a kungiyar iyali? Duba shi tukuna. Tura labaran karya na mai da KAI cikin matsalar - kuma dokar Najeriya yanzu ta shafi yada labaran karya.

  Zama mutumin da ke tantancewa a al'ummarka. A zamanin AI, wannan babban karfi ne.

