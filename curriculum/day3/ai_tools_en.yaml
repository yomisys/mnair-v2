id: day3_ai_tools_en
day: 3
topic: ai_tools
language: en
title: "Simple Tools for Working with Data"
content: |
  You don't need to be a data scientist to start working with data. Today, let's learn free tools that turn you into a data-smart Nigerian - useful for business, school, or your first tech job.

  GOOGLE FORMS (free):
  Create surveys and collect data easily. A shop owner can ask customers: "Which products should we stock?" Responses collect automatically into a spreadsheet. This is DATA COLLECTION - step 1 of the AI journey you learned!

  GOOGLE SHEETS / EXCEL (free):
  The most important data tool in the world. You can:
  - Record daily sales and see monthly patterns
  - Sort and filter (show only customers from Abuja)
  - Make charts that reveal trends instantly
  - Clean data (remove duplicates with two clicks)
  Many data careers start with strong spreadsheet skills!

  CHATGPT AS DATA ASSISTANT:
  Paste in your sales numbers and ask: "Which day of the week do I sell most?" or "Summarize this customer feedback into 3 main complaints." AI tools can analyze small datasets conversationally - no coding needed.

  GOOGLE TRENDS (trends.google.com):
  See what Nigerians are searching for - free market research! A fashion seller can compare searches for "ankara styles" vs "lace styles" by state and month.

  PRACTICE TASK FOR TODAY:
  Open Google Forms. Create a 3-question survey about anything (your business, your community). Share it with 5 friends on WhatsApp. Congratulations - you just collected your first dataset!

  Remember: AI is built on data, and now YOU can collect, organize, and analyze it. That skill alone makes you valuable.

