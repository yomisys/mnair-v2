day: 3
topic: what_is_ai
language: ig
title: "Data: Nri Na-Azu AI"
content: |
  I mutara na AI na-amuta site n'ihe atu. Taa anyi ga-abanye omimi: ihe atu ndi ahu ka a na-akpo DATA, data bukwa ihe kacha mkpa na AI.

  GINI BU DATA?
  Data bu naani ozi e dekotara. Mgbe obula e dere ihe, see foto ya, ma o bu tuo ya, e meputala data:
  - Foto ihu gi = data foto
  - Ozi olu gi = data uda
  - "M rere nkata tomato 50 taa" = data ahia
  - Ebe i no mgbe i na-eji Maps = data ebe

  Na-enweghi data, AI di ka nwa akwukwo na-enweghi akwukwo, enweghi onye nkuzi, enweghi ihe atu - o nweghi ike imuta ihe obula.

  DATA OLE KA AI CHORO?
  OTUTU NKE UKWUU. ChatGPT guru ihe edere karia ihe mmadu nwere ike igu na ndu 1,000. Model imata ihu nwere ike imu otutu nde ihu. O bu ya mere ulo oru ji achikota otutu data - data bu mmanu ohuru, Naijiria makwaara banyere mmanu!

  UDI DATA AI NA-EJI:
  1. IHE EDERE: ozi, akwukwo, weebusaiti (na-akwado chatbots na nsughari)
  2. FOTO: foto, scans (na-akwado imeghe ekwenti n'ihu, ichoputa oria)
  3. UDA: okwu, uda (na-akwado ndi inyeaka olu)
  4. ONUOGUGU: onu ahia, ndekorita ihu igwe, azumahia (na-akwado ibu amuma)

  IDI MMA KA UBA MMA:
  Otu nde foto gbaru agbaru na-akuzi ihe na-eru 100,000 foto doro anya nke e dere akara nke oma. Cheta Garbage In, Garbage Out nke unyaahu? Ezigbo AI na-ebido na ezigbo data.

  Lee ihe na-ato uto: ozi WhatsApp obula i dere n'asusu Igbo, ozi olu obula - udi data ahu ka asusu Naijiria CHORO ka ha banye n'odiniru AI. Anyi ga-ekwukwu na ihe omumu ozo!

quiz:
