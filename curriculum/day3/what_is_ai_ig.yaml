    options:
      - "A. O ga-aru oru ngwa ngwa"
      - "B. O nweghi ike imuta ihe obula"
      - "C. O ga-adi onu ala"
      - "D. O dighi ihe ga-agbanwe"
    correct: 1

  - question: "Kedu udi data na-akwado ndi inyeaka olu?"
    options:
      - "A. Data uda"
      - "B. Naani data ebe"
      - "C. Data ahia"
      - "D. O choghi data"
