  - question: "Gini mere e ji akpo data 'mmanu ohuru'?"
    options:
      - "A. N'ihi na o di oji ma buru mmiri"
      - "B. O bu aku bara uru nke na-akwado teknuzu oge a"
      - "C. O na-esi n'ala aputa"
      - "D. A na-eji ya na jenereto"
    correct: 1

  - question: "Kedu nke ka baa uru maka ozuzu AI?"
    options:
      - "A. Otu nde foto gbaru agbaru"
      - "B. 100,000 foto doro anya nke e dere akara nke oma"
      - "C. Enweghi foto ma oli"
      - "D. Idi mma adighi mkpa"
    correct: 1
