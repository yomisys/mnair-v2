day: 3
topic: what_is_ai
language: yo
title: "Data: Ounje Ti N Bo AI"
content: |
  O ti ko pe AI n ko eko lati inu apeere. Loni a o lo jinle: DATA ni a n pe awon apeere yen, data si ni eroja pataki julo ninu AI.

  KI NI DATA?
  Data je alaye ti a ti kọ sile lasan. Igbakugba ti a ba ko nkan sile, ya foto re, tabi won on, a ti da data sile:
  - Foto oju re = data aworan
  - Akosile ohun re = data ohun
  - "Mo ta agbon tomati 50 loni" = data tita
  - Ibi ti o wa nigbati o n lo Maps = data ipo

  Laisi data, AI dabi akeko ti ko ni iwe, ko ni oluko, ko si ni apeere - ko le ko ohunkohun.

  DATA MELO NI AI NILO?
  PUPO GAN-AN. ChatGPT ka iwe ju ohun ti eniyan kan le ka ni igbesi aye 1,000 lo. Modeli didamo oju le ko miliọnu oju. Idi niyen ti awon ile-ise fi n ko data pupo jo - data ni epo titun, Naijiria si mo nipa epo!

  IRU DATA TI AI N LO:
  1. ỌRỌ KIKỌ: ifiranse, iwe, awon oju opo wẹẹbu (o n mu chatbots ati itumo sise)
  2. AWORAN: foto, scans (o n mu sisi foonu pelu oju, riri arun sise)
  3. OHUN: ọrọ sisọ, iro (o n mu awon oluranlowo ohun sise)
  4. NOMBA: owo oja, akosile oju-ojo, isowo (o n mu asotele sise)

  DIDARA JU OPO LO:
  Miliọnu foto ti ko dan ko ni ko ni eko to 100,000 foto ti o dan ti a fi aami si daradara. Ranti Garbage In, Garbage Out lati ana? AI to dara n bere pelu data to dara.

  Eyi ni apa ti o dun: gbogbo ifiranse WhatsApp ti o te ni Yoruba, gbogbo akosile ohun - iru data yen ni awon ede Naijiria NILO lati wa ninu ojo iwaju AI. A o so siwaju sii ni eko ti o kan!

