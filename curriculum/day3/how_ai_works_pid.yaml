day: 3
topic: how_ai_works
language: pid
title: "From Raw Data to Smart AI: The Data Journey"
content: |
  Yesterday you learn about training. But before training fit start, data must go journey. Make we follow am!

  STEP 1 - COLLECTION:
  Dem dey gather data from many sources: cameras, forms, sensors, apps, surveys. Example: one agric startup dey drive through farms for Kaduna dey snap maize plants - healthy ones and sick ones.

  STEP 2 - CLEANING:
  Raw data dey scatter! Blurry photos, double entries, wrong spellings ("Lagos", "Lagoss", "LAGOS"). Data scientists dey spend most of their time here - up to 80%! Dirty data dey confuse AI, like to teach pikin from textbook wey tear and stain.

  STEP 3 - LABELING:
  Human beings go tag each example: "this leaf healthy", "this one get blight". Na real work wey real people dey do - labeling jobs dey employ thousands of young Africans today. The labels na the "answers" wey AI go learn from.

  STEP 4 - TRAINING:
  The clean, labeled data go feed the learning process wey you learn about yesterday. The model go study am millions of times.

  STEP 5 - TESTING:
  Before dem release am, dem go test the model with data wey e NEVER see before. If e score well, e don ready. If e no score well, dem go go back to training - sometimes back to gathering better data!

  WHY THIS ONE CONCERN YOU:
  When app ask you "This translation helpful? 👍👎" - you dey LABEL data be that. When you type for your language, you fit dey help future AI learn am. Every Naija person wey dey use technology dey quietly shape tomorrow AI. The question be say: our languages and faces go well-represented? E depend on data from people like you.

quiz:
  - question: "Wetin be the correct order of the data journey?"
    options:
      - "A. Collection → Cleaning → Labeling → Training → Testing"
      - "B. Testing → Training → Collection"
      - "C. Labeling → Collection → Sleeping"
      - "D. Na only training, nothing else"
    correct: 0

  - question: "Where data scientists dey spend most of their time?"
    options:
      - "A. To buy computers"
      - "B. To clean scattered data"
      - "C. To watch videos"
      - "D. To write emails"
    correct: 1

  - question: "Wetin be data labeling?"
    options:
      - "A. Human beings wey dey tag examples with correct answers"
      - "B. To print stickers"
      - "C. To give your phone name"
      - "D. To delete old files"
    correct: 0

  - question: "Why dem dey test the model with data wey e never see?"
    options:
      - "A. To waste time"
      - "B. To check say e truly learn, no be say e just cram"
      - "C. Because new data cheap pass"
      - "D. Testing no necessary"
    correct: 1

  - question: "When you click 👍 for translation, wetin you dey do?"
    options:
      - "A. Nothing useful"
      - "B. You dey help label data wey fit improve the AI"
      - "C. You dey buy the app"
      - "D. You dey delete the translation"
    correct: 1
