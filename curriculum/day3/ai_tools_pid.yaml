day: 3
topic: ai_tools
language: pid
title: "Simple Tools to Work with Data"
content: |
  You no need to be data scientist before you start to work with data. Today, make we learn free tools wey go turn you to data-smart Naija person - e useful for business, school, or your first tech job.

  GOOGLE FORMS (free):
  Create surveys and gather data easy easy. Shop owner fit ask customers: "Which products we suppose stock?" The responses go gather automatically inside spreadsheet. Na DATA COLLECTION be this - step 1 of the AI journey wey you learn!

  GOOGLE SHEETS / EXCEL (free):
  Na the most important data tool for the world. You fit:
  - Record daily sales and see monthly patterns
  - Sort and filter (show only customers from Abuja)
  - Make charts wey go show trends immediately
  - Clean data (remove duplicates with two clicks)
  Many data careers dey start with strong spreadsheet skills!

  CHATGPT AS DATA ASSISTANT:
  Paste your sales numbers and ask: "Which day of the week I dey sell pass?" or "Summarize this customer feedback into 3 main complaints." AI tools fit analyze small datasets like conversation - no coding needed.

  GOOGLE TRENDS (trends.google.com):
  See wetin Nigerians dey search for - free market research! Fashion seller fit compare searches for "ankara styles" vs "lace styles" by state and month.

  PRACTICE TASK FOR TODAY:
  Open Google Forms. Create 3-question survey about anything (your business, your community). Share am with 5 friends for WhatsApp. Congratulations - you just gather your first dataset!

  Remember: na data dem take build AI, and now YOU fit collect, organize, and analyze am. That skill alone don make you valuable.

