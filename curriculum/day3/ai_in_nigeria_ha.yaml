title: "Bayanan Najeriya: Harsunanmu, Makomarmu"
content: |
  Ga matsala: an horar da yawancin AI da bayanan Turanci da Sinanci. Idan AI bai fahimci karin maganar Hausa, sautin Yoruba, ko salon maganar Igbo ba, ba zai iya yi wa 'yan Najeriya miliyan 200 hidima yadda ya kamata ba. Yau, bari mu dubi labarin bayanan Najeriya.

  GIBIN BAYANAI:
  - Turanci na da tiriliyoyin kalmomi a yanar gizo don horar da AI
  - Hausa, Yoruba, da Igbo - da mutane sama da miliyan 100 ke magana - suna da kaso kadan kwarai
  - Sakamako: mataimakan murya da ba sa jin lafazinmu, masu fassara da ke rasa ma'anarmu

  'YAN NAJERIYA MASU RUFE GIBIN:
  1. Masu bincike da masu sa kai na gina bayanan harsunan Najeriya - suna rikodin magana, fassara jimloli, tattara rubutu
  2. Kamfanonin Lagos na daukar masu yin lakabi ga bayanai - matasan Najeriya masu samun kudi ta koya wa AI
  3. Ayyuka kamar Masakhane (ma'ana "Muna ginawa tare" a isiZulu) na hada masu binciken Afirka masu gina AI na fassara ga harsunan Afirka
  4. Ma'ajiyar gidajen rediyo na shirye-shiryen harsunan gida na zama ma'adinan zinariya ga AI na murya

  DALILIN DA BAYANAN GIDA KE NASARA:
  Modelin hasashen ambaliya na bukatar bayanan ruwan sama na NAJERIYA. Modelin amfanin gona na bukatar bayanan kasarMU. Chatbot na lafiya na bukatar fahimtar yadda MU ke bayyana alamun rashin lafiya. Bayanan kasashen waje ba za su iya daukar hakikanin Najeriya ba.

  DAMAR DA KAKE DA ITA:
  Tattara bayanai, tsaftacewa, da yin lakabi hanyoyi ne na farko zuwa sana'o'in AI - suna bukatar kulawa, ba manyan digiri ba. Kuma amfani da fasaha da harshenka kawai - sakonnin murya, posts, reviews - na kara muryoyin Najeriya a duniyar dijital.

  Harshenka bayanai ne. Kwarewarka bayanai ce. Daga gare su ne za a gina makomar AI ta Najeriya.

