day: 3
topic: what_is_ai
language: en
title: "Data: The Food That Feeds AI"
content: |
  You've learned that AI learns from examples. Today we go deeper: those examples are called DATA, and data is the single most important ingredient in AI.

  WHAT IS DATA?
  Data is simply recorded information. Every time something is written down, photographed, or measured, data is created:
  - A photo of your face = image data
  - Your voice note = audio data
  - "Sold 50 baskets of tomatoes today" = sales data
  - Your location when using Maps = location data

  Without data, AI is like a student with no books, no teacher, and no examples - it can learn nothing.

  HOW MUCH DATA DOES AI NEED?
  A LOT. ChatGPT read more text than any human could read in 1,000 lifetimes. A face recognition model may study millions of faces. This is why companies collect so much data - data is the new oil, and Nigeria knows about oil!

  TYPES OF DATA AI USES:
  1. TEXT: messages, books, websites (powers chatbots and translation)
  2. IMAGES: photos, scans (powers face unlock, disease detection)
  3. AUDIO: speech, sounds (powers voice assistants)
  4. NUMBERS: prices, weather records, transactions (powers predictions)

  QUALITY BEATS QUANTITY:
  One million blurry photos teach less than 100,000 clear, well-labeled ones. Remember Garbage In, Garbage Out from yesterday? Good AI starts with good data.

  Here's the exciting part: every WhatsApp message you type in Pidgin, every Hausa voice note - that's the kind of data Nigerian languages NEED to be part of the AI future. More on that in the next lesson!

