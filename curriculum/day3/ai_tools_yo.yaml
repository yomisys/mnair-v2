day: 3
topic: ai_tools
language: yo
title: "Awon Irinse Rọrun Fun Sise Pelu Data"
content: |
  O ko nilo lati je onimo sayensi data ki o to bere si sise pelu data. Loni, je ki a ko awon irinse ofe ti yoo so o di ara Naijiria ti o gbon ninu data - o wulo fun isowo, ile-iwe, tabi ise imo-ero akoko re.

  GOOGLE FORMS (ofe):
  Da iwadii sile ki o si ko data jo ni irorun. Oniṣowo le beere lowo awon onibara: "Awon oja wo ni ki a maa ta?" Awon idahun yoo ko ara won jo si inu spreadsheet laifowoyi. Eyi ni GBIGBA DATA - igbese 1 ti irin-ajo AI ti o ko!

  GOOGLE SHEETS / EXCEL (ofe):
  Irinse data pataki julo ni agbaye. O le:
  - Ko tita ojoojumo sile ki o si ri ilana osu
  - To won lẹsẹẹsẹ ki o si yan (fi awon onibara Abuja han nikan)
  - Se awon aworan atẹ ti yoo fi awon ilana han lesekese
  - Mọ data (yo awon adakọ kuro pelu titẹ leemeji)
  Opolopo ise data n bere pelu imo spreadsheet to lagbara!

  CHATGPT GEGE BI OLURANLOWO DATA:
  Le awon nomba tita re sibe ki o beere: "Ojo wo ninu ose ni mo n ta ju?" tabi "Akotan esi awon onibara yii si awon ẹdun pataki 3." Awon irinse AI le se ayewo dataset kekere bi ibanisọrọ - ko nilo kikọ koodu.

  GOOGLE TRENDS (trends.google.com):
  Wo ohun ti awon ara Naijiria n wa - iwadii oja ofe! Oniṣowo aso le fi wiwa "ankara styles" we "lace styles" ni ibamu si ipinle ati osu.

  ISE IDANRAWO FUN ONI:
  Si Google Forms. Da iwadii ibeere 3 sile nipa ohunkohun (isowo re, agbegbe re). Pin in pelu ore 5 lori WhatsApp. Ku oriire - o ti ko dataset akoko re jo!

  Ranti: data ni a fi n ko AI, bayii si IWO le gba a jo, to o lẹsẹẹsẹ, ki o si se ayewo re. Imo yen nikan ti so o di eni iyebiye.

