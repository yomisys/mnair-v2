day: 3
topic: ai_tools
language: ig
title: "Ngwa Di Mfe Maka Iji Data Aru Oru"
content: |
  I kwesighi ibu onye sayensi data tupu i bido iji data aru oru. Taa, ka anyi muta ngwa efu ndi ga-eme gi onye Naijiria maara data - o bara uru maka azumahia, akwukwo, ma o bu oru teknuzu mbu gi.

  GOOGLE FORMS (efu):
  Mepu nyocha ma chikota data n'uzo di mfe. Onye nwe ulo ahia nwere ike iju ndi ahia: "Kedu ngwaahia anyi kwesiri ire?" Aziza na-achikota onwe ha n'ime spreadsheet. Nke a bu ICHIKOTA DATA - nzoputa 1 nke njem AI i mutara!

  GOOGLE SHEETS / EXCEL (efu):
  Ngwa data kacha mkpa n'uwa. I nwere ike:
  - Dekota ahia kwa ubochi ma hu usoro kwa onwa
  - Hazie ma nyochaa (gosi naani ndi ahia si Abuja)
  - Mee chaatu na-egosi usoro ozugbo
  - Hichaa data (wepu ihe ugboro abuo site n'ipi ugboro abuo)
  Otutu oru data na-ebido site n'ezigbo nka spreadsheet!

  CHATGPT DI KA ONYE INYEAKA DATA:
  Tinye onuogugu ahia gi ma juo: "Kedu ubochi n'izu ka m na-erekarị?" ma o bu "Chikota nzaghachi ndi ahia a ka o buru isi mkpesa 3." Ngwa AI nwere ike inyocha obere dataset di ka mkparita uka - o dighi mkpa ide koodu.

  GOOGLE TRENDS (trends.google.com):
  Hu ihe ndi Naijiria na-acho - nyocha ahia efu! Onye na-ere uwe nwere ike iji ochucho "ankara styles" tunyere "lace styles" site na steeti na onwa.

  ORU OMUME MAKA TAA:
  Meghee Google Forms. Mepu nyocha ajuju 3 banyere ihe obula (azumahia gi, obodo gi). Kesaa ya na ndi enyi 5 na WhatsApp. Ekele - i chikotala dataset mbu gi!

  Cheta: data ka e ji ewu AI, ugbu a kwa GI nwere ike ichikota, hazie, ma nyochaa ya. Naani nka ahu emeela ka i baa uru.

quiz:
