day: 3
topic: what_is_ai
language: pid
title: "Data: The Food Wey Dey Feed AI"
content: |
  You don learn say AI dey learn from examples. Today we go enter deep: those examples na im dem dey call DATA, and data na the most important ingredient for AI.

  WETIN BE DATA?
  Data na simply information wey dem record. Anytime wey dem write something down, snap am, or measure am, data don dey created:
  - Photo of your face = image data
  - Your voice note = audio data
  - "I sell 50 baskets of tomatoes today" = sales data
  - Your location when you dey use Maps = location data

  Without data, AI be like student wey no get book, no get teacher, no get examples - e no fit learn anything.

  HOW MUCH DATA AI NEED?
  PLENTY. ChatGPT read text pass wetin any human being fit read for 1,000 lifetimes. Face recognition model fit study millions of faces. Na why companies dey gather plenty data - data na the new oil, and Naija sabi about oil!

  TYPES OF DATA WEY AI DEY USE:
  1. TEXT: messages, books, websites (e dey power chatbots and translation)
  2. IMAGES: photos, scans (e dey power face unlock, disease detection)
  3. AUDIO: speech, sounds (e dey power voice assistants)
  4. NUMBERS: prices, weather records, transactions (e dey power predictions)

  QUALITY PASS QUANTITY:
  One million blurry photos dey teach less than 100,000 clear ones wey dem label well. You remember Garbage In, Garbage Out from yesterday? Good AI dey start with good data.

  Na the sweet part be this: every WhatsApp message wey you type for Pidgin, every Hausa voice note - na that kind data Naija languages NEED to enter the AI future. We go talk more for the next lesson!

