topic: what_is_ai
language: ha
title: "Bayanai: Abincin da ke Ciyar da AI"
content: |
  Ka koya cewa AI na koyo daga misalai. Yau za mu zurfafa: wadannan misalan ana kiransu BAYANAI (DATA), kuma bayanai su ne mafi muhimmancin sinadari a AI.

  MENENE BAYANAI?
  Bayanai kawai bayani ne da aka adana. Duk lokacin da aka rubuta wani abu, aka dauki hotonsa, ko aka auna shi, an samar da bayanai:
  - Hoton fuskarka = bayanan hoto
  - Sakon muryarka = bayanan sauti
  - "Na sayar da kwanduna 50 na tumatir yau" = bayanan sayarwa
  - Wurin da kake lokacin amfani da Maps = bayanan wuri

  Ba tare da bayanai ba, AI kamar dalibi ne ba shi da littattafai, ba malami, ba misalai - ba zai iya koyon komai ba.

  NAWA NE BAYANAN DA AI KE BUKATA?
  MASU YAWAN GASKE. ChatGPT ya karanta rubutu fiye da abin da mutum zai iya karantawa a rayuwa 1,000. Modelin gane fuska na iya nazarin miliyoyin fuskoki. Shi ya sa kamfanoni ke tattara bayanai masu yawa - bayanai su ne sabon mai, kuma Najeriya ta san game da mai!

  NAU'IKAN BAYANAN DA AI KE AMFANI DA SU:
  1. RUBUTU: sakonni, littattafai, shafukan yanar gizo (na tafiyar da chatbots da fassara)
  2. HOTUNA: hotuna, scans (na tafiyar da bude waya da fuska, gano cututtuka)
  3. SAUTI: magana, sautuka (na tafiyar da mataimakan murya)
  4. LAMBOBI: farashi, bayanan yanayi, ma'amaloli (na tafiyar da hasashe)

  INGANCI YA FI YAWA:
  Hotuna miliyan daya marasa kyau na koyarwa kasa da hotuna 100,000 bayyanannu da aka yi wa lakabi da kyau. Ka tuna Garbage In, Garbage Out na jiya? AI mai kyau na farawa da bayanai masu kyau.

  Ga abin farin ciki: kowane sakon WhatsApp da ka rubuta da Hausa, kowane sakon murya - irin wannan bayanan ne harsunan Najeriya ke BUKATA don shiga makomar AI. Kara bayani a darasi na gaba!

