title: "Data Naijiria: Asusu Anyi, Odiniru Anyi"
content: |
  Lee nsogbu: e ji data Bekee na Chinese zuo otutu AI. Mgbe AI aghotaghi ilu Hausa, uda olu Yoruba, ma o bu akpaalaokwu Igbo, o nweghi ike ijere nde mmadu 200 Naijiria ozi nke oma. Taa, ka anyi leba anya n'akuko data Naijiria.

  OGHERE DATA:
  - Bekee nwere otutu ijeri ijeri okwu n'intaneti maka ozuzu AI
  - Hausa, Yoruba, na Igbo - nke ihe karia nde mmadu 100 na-asu - nwere naani obere oke
  - Nsoputa: ndi inyeaka olu na-apughi inu olu anyi, ndi nsughari na-efunari nkowa anyi

  NDI NAIJIRIA NA-EMECHI OGHERE AHU:
  1. Ndi nyocha na ndi oru afo ofuma na-ewu dataset maka asusu Naijiria - ha na-edekota okwu, na-asughari ahiriokwu, na-achikota ihe edere
  2. Ulo oru ndi di na Lagos na-ewe ndi na-ede akara data n'oru - ndi ntorobia Naijiria na-enweta ego site n'ikuzi AI ihe
  3. Oru ngo di ka Masakhane (nke putara "Anyi na-ewuko onu" na isiZulu) na-ejikota ndi nyocha Afrika na-ewu AI nsughari maka asusu Afrika
  4. Ebe nchekwa ulo oru redio nke mgbasa ozi asusu obodo na-aghoro ebe ngwuputa olaedo maka AI olu

  GINI MERE DATA OBODO JI EMERI:
  Model ibu amuma idei mmiri choro ndekorita mmiri ozuzo NAIJIRIA. Model ihe okuku choro data ala ANYI. Chatbot ahuike choro ighota otu ANYI si akowa oria ("ahu na-akpa m"). Data mba ozo enweghi ike ijide eziokwu Naijiria.

  OHERE DIRI GI:
  Ichikota data, ihicha ya, na ide akara bu uzo mbido banye n'oru AI - ha choro ilezi anya, o bughi nnukwu akara mmuta. Ozokwa, naani iji teknuzu n'asusu gi - ozi olu, posts, nyocha - na-etinye olu Naijiria n'uwa dijital.

  Asusu gi bu data. Ahumihe gi bu data. Site na ya ka a ga-esi wuo odiniru AI Naijiria.

