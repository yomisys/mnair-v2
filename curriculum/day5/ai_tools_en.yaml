id: day5_ai_tools_en
day: 5
topic: ai_tools
language: en
title: "The Builder's Toolbox: Create Real Things Today"
content: |
  Yesterday you learned to prompt like a pro. Today: tools that turn prompts into finished PRODUCTS - documents, designs, apps, and more.

  CREATE DOCUMENTS & PRESENTATIONS:
  - ChatGPT/Gemini: full business proposals, CVs, letters - then refine
  - Canva Docs + AI: turns your outline into styled documents
  - Gamma.app: type a topic, get a complete slide presentation. Students and trainers love this!

  CREATE DESIGNS:
  - Canva Magic Studio: "Instagram post for my restaurant's Friday special" → done
  - Microsoft Designer (free): generates design options from one sentence
  - Remove.bg: deletes photo backgrounds instantly for clean product photos

  CREATE AUDIO & VIDEO:
  - CapCut: AI-powered video editing on your phone - auto-captions in English (great for Nigerian creators!)
  - Voice typing in WhatsApp/Google Docs: speak your first draft, edit after

  CREATE SIMPLE APPS & FORMS:
  - Google Forms + Sheets: order forms, registrations, surveys
  - Glide: convert that sheet into a phone app
  - WhatsApp Business: catalog + auto-replies = a mini storefront (FREE)

  A REAL COMBO ANYONE CAN DO:
  1. ChatGPT: "Write 5 WhatsApp status posts promoting my weekend okrika sale"
  2. Canva: design matching status images
  3. WhatsApp Business: schedule and post
  Total cost: ₦0. Total time: under 1 hour. That's BUILDING.

  PORTFOLIO TIP:
  Save everything you create this week. Three good samples = a portfolio you can show employers or clients. "I made these with AI tools" is now a hireable sentence!

