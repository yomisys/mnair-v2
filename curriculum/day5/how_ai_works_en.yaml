      - "A. Showing examples of the pattern you want completed"
      - "B. Asking very short questions"
      - "C. Using the app quickly"
      - "D. Shooting photos"
    correct: 0

  - question: "What does a system prompt do?"
    options:
      - "A. Sets behavior rules that every reply follows"
      - "B. Turns off the AI"
      - "C. Charges your phone"
      - "D. Deletes history"
    correct: 0

  - question: "What happens when you ask AI to check its own answer?"
    options:
      - "A. It often catches and corrects its own mistakes"
      - "B. It gets angry"
      - "C. It refuses to answer"
      - "D. It crashes"
    correct: 0
