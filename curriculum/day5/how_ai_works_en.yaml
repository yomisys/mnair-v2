day: 5
topic: how_ai_works
language: en
title: "Prompt Engineering: Programming in Plain Language"
content: |
  Here's a beautiful secret: prompting IS a form of programming. Traditional programmers write instructions in Python; you write instructions in English (or Pidgin!). Today, level up from good prompts to great SYSTEMS of prompts.

  TECHNIQUE 1 - CHAIN OF THOUGHT:
  For complex problems, ask AI to "think step by step before answering." This dramatically improves accuracy on maths, planning, and logic. Try: "Think step by step: if I save ₦500 daily but spend ₦2,000 every Sunday, how much do I save in 4 weeks?"

  TECHNIQUE 2 - FEW-SHOT EXAMPLES:
  Show the pattern you want:
  "Convert complaints to polite responses.
  Complaint: 'Your delivery is late!' → Response: 'We sincerely apologize...'
  Complaint: 'Wrong size!' → Response:"
  The AI completes the pattern. This is exactly how training works - you're teaching with examples!

  TECHNIQUE 3 - STRUCTURED OUTPUT:
  Demand format: "Reply ONLY with a table: Item | Cost | Where to buy in Lagos." Structured outputs plug into spreadsheets and documents directly.

  TECHNIQUE 4 - THE SYSTEM PROMPT:
  Set behavior once: "You are my study partner for WAEC Physics. Always quiz me after explaining. Use Nigerian examples. Keep answers under 200 words." Every reply now follows your rules!

  TECHNIQUE 5 - SELF-CHECKING:
  After an answer: "Now check your answer for errors and correct any you find." AI catches many of its own mistakes when asked.

  These five techniques together make you more effective with AI than 95% of users. Practice one today - your "programming" career just started!

quiz:
  - question: "Why is prompting like programming?"
    options:
      - "A. You write instructions, just in plain language instead of code"
      - "B. It requires a computer science degree"
      - "C. It only works on big computers"
      - "D. It is not similar at all"
    correct: 0

  - question: "What does 'think step by step' improve?"
    options:
      - "A. Accuracy on maths, planning, and logic problems"
      - "B. Phone battery life"
      - "C. Internet speed"
      - "D. Nothing"
    correct: 0

  - question: "What is few-shot prompting?"
