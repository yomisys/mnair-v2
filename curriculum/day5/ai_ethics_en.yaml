day: 5
topic: ai_ethics
language: en
title: "Building Responsibly: The Honest Creator's Code"
content: |
  With great building power comes great responsibility. As you start creating with AI, adopt the Honest Creator's Code - it protects your reputation, your users, and your community.

  RULE 1 - DISCLOSE WHEN IT MATTERS:
  School essay written by AI and submitted as your own work? That's cheating, and schools increasingly detect it. Job application claiming skills you don't have? It collapses at the interview. Use AI to LEARN and DRAFT - the final understanding must be yours.

  RULE 2 - VERIFY BEFORE YOU PUBLISH:
  You are responsible for what you post - even if AI wrote it. If your AI-generated health post spreads false medicine advice, the harm (and blame) is yours. Check facts, especially health, legal, and financial claims.

  RULE 3 - RESPECT OWNERSHIP:
  Don't generate fake images of real people. Don't clone a musician's voice for your jingle without permission. Don't pass off AI copies of another designer's style as original commissioned work. Nigerian creatives are fighting for fair credit - be on the right side.

  RULE 4 - PROTECT OTHER PEOPLE'S DATA:
  Building that tailor measurement bot? Those measurements are personal data under NDPA. Collect only what you need, keep it secure, delete when asked. Your users' trust is your real capital.

  RULE 5 - BUILD FOR GOOD:
  The same AI that writes marketing copy can write scam messages. The same voice cloning that dubs Nollywood films can power fraud calls. Every Nigerian builder choosing the honest path strengthens our tech reputation globally - and that reputation brings investment and jobs for everyone.

  THE SIMPLE TEST:
  "Would I be comfortable if everyone knew exactly how I made this?" If yes - build on!

