      - "B. Kunna waka kawai"
      - "C. Maye gurbin dukkan masu shirye-shirye"
      - "D. Babu wani abu mai amfani"
    correct: 0

  - question: "Ta yaya AI zai iya taimaka wa mai koyon rubuta code?"
    options:
      - "A. Yana bayyana kurakurai cikin hakuri kamar malami kyauta"
      - "B. Ba zai iya taimakawa da coding ba"
      - "C. Yana rubuta viruses"
      - "D. Yana aiki ga kwararru kawai"
    correct: 0

  - question: "Wace fa'ida mai sayarwa a kasuwa take da ita fiye da mai code da bai taba zuwa kasuwa ba?"
    options:
      - "A. Ta fi fahimtar matsalar ta gaske"
      - "B. Tana rubutu da sauri"
      - "C. Tana da karin digiri"
      - "D. Babu wata fa'ida"
    correct: 0
